<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كنوز — Künûz · Arapça Kelime Hazinesi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-2:#F7F7FB; --surface:#FFFFFF; --surface-2:#F4F4F9; --surface-3:#ECECF5;
    --border:#E4E4EE; --border-soft:#ECECF4;
    --accent:#7C3AED; --accent-2:#DB2777; --accent-soft:#7C3AED; --accent-dim:#C4B5FD; --accent-ink:#F1EBFF;
    --grad-accent: linear-gradient(135deg, #6366F1 0%, #A855F7 50%, #EC4899 100%);
    --text:#16161F; --text-dim:#5B5C6B; --text-faint:#9496A5;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#E11D48; --rose-soft:#FDEFF2; --rose-line:#F3AABB;
    --blue:#0284C7; --amber:#D97706; --amber-soft:#FEF3DC; --teal:#0D9488;
    --header-bg: rgba(255,255,255,0.85); --menu-bg:#FFFFFF; --hero-grad-2:#FBEFFF;
  }
  /* --- Gece Modu --- */
  [data-theme="dark"]{
    --bg:#0B0B14; --bg-2:#111119; --surface:#15151F; --surface-2:#1B1B26; --surface-3:#23232F;
    --border:#2B2B39; --border-soft:#232330;
    --accent:#A78BFA; --accent-2:#F472B6; --accent-soft:#A78BFA; --accent-dim:#6D28D9; --accent-ink:#241C3D;
    --grad-accent: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
    --text:#F1F1F6; --text-dim:#A8A8B8; --text-faint:#6E6E80;
    --green:#34D399; --green-soft:#0F2A20; --green-line:#1F6B4C;
    --rose:#FB7185; --rose-soft:#341019; --rose-line:#7A2436;
    --blue:#38BDF8; --amber:#FBBF24; --amber-soft:#332409; --teal:#2DD4BF;
    --header-bg: rgba(11,11,20,0.85); --menu-bg:#15151F; --hero-grad-2:#241C3D;
  }
  /* --- Kültürel Tema (İznik çinisi ilhamlı: lacivert-turkuaz-hardal) --- */
  [data-theme="cultural"]{
    --bg:#FBF8F1; --bg-2:#F3ECDD; --surface:#FFFFFF; --surface-2:#F4EFE0; --surface-3:#ECE1C4;
    --border:#E3D6AE; --border-soft:#ECE1C4;
    --accent:#0F6E6E; --accent-2:#B8860B; --accent-soft:#0F6E6E; --accent-dim:#8FC7C4; --accent-ink:#E7F3F1;
    --grad-accent: linear-gradient(135deg, #0B5D6B 0%, #14827E 50%, #C79A2A 100%);
    --text:#1E2A2A; --text-dim:#5B6660; --text-faint:#93998F;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#B23A48; --rose-soft:#FBEDEA; --rose-line:#E3AFAF;
    --blue:#0B6E8F; --amber:#B8860B; --amber-soft:#FBF0D9; --teal:#0D9488;
    --header-bg: rgba(251,248,241,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#F3ECDD;
  }
  /* --- Zümrüt Tema (orman yeşili + altın) --- */
  [data-theme="emerald"]{
    --bg:#F4FAF6; --bg-2:#E8F5EC; --surface:#FFFFFF; --surface-2:#EAF6EE; --surface-3:#DCEFE2;
    --border:#CFE8D8; --border-soft:#DCEFE2;
    --accent:#0F7A4D; --accent-2:#B8860B; --accent-soft:#0F7A4D; --accent-dim:#8FD1AE; --accent-ink:#E3F5EA;
    --grad-accent: linear-gradient(135deg, #0B6B41 0%, #159A5B 50%, #D4AF37 100%);
    --text:#12261C; --text-dim:#4E6857; --text-faint:#8CA79A;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#C23B4B; --rose-soft:#FBEDEA; --rose-line:#E3AFAF;
    --blue:#0B6E8F; --amber:#B8860B; --amber-soft:#FBF0D9; --teal:#0D9488;
    --header-bg: rgba(244,250,246,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#E8F5EC;
  }
  /* --- Okyanus Tema (derin mavi-turkuaz) --- */
  [data-theme="ocean"]{
    --bg:#F2F8FC; --bg-2:#E4F0FA; --surface:#FFFFFF; --surface-2:#E9F2FA; --surface-3:#D9EAF6;
    --border:#C9E0F2; --border-soft:#D9EAF6;
    --accent:#0369A1; --accent-2:#0891B2; --accent-soft:#0369A1; --accent-dim:#93C5DE; --accent-ink:#E3F0FA;
    --grad-accent: linear-gradient(135deg, #075985 0%, #0EA5C4 50%, #22D3EE 100%);
    --text:#0B1F2E; --text-dim:#4C6579; --text-faint:#88A0B2;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#DC3B5D; --rose-soft:#FCEBEF; --rose-line:#F0AEC0;
    --blue:#0284C7; --amber:#CA8A04; --amber-soft:#FDF0D4; --teal:#0D9488;
    --header-bg: rgba(242,248,252,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#E4F0FA;
  }
  /* --- Sepya Tema (sıcak kahve/krem, göz dostu okuma) --- */
  [data-theme="sepia"]{
    --bg:#F5EEDC; --bg-2:#EFE4CB; --surface:#FBF4E4; --surface-2:#F0E5CB; --surface-3:#E6D8B7;
    --border:#DBC79E; --border-soft:#E6D8B7;
    --accent:#8B5A2B; --accent-2:#A6762F; --accent-soft:#8B5A2B; --accent-dim:#D2AC7D; --accent-ink:#EDE0C5;
    --grad-accent: linear-gradient(135deg, #6E4423 0%, #96652F 50%, #C79A4E 100%);
    --text:#2E2311; --text-dim:#6B5A3B; --text-faint:#A08F6C;
    --green:#4B7A3E; --green-soft:#E8F0DE; --green-line:#B7D19E;
    --rose:#A2413A; --rose-soft:#F3E3DD; --rose-line:#D9A79E;
    --blue:#436B87; --amber:#A6762F; --amber-soft:#F1DFB8; --teal:#5C8A7A;
    --header-bg: rgba(245,238,220,0.88); --menu-bg:#FBF4E4; --hero-grad-2:#EFE4CB;
  }
  /* --- Kehribar Tema (çöl kumu, terracotta, altın) --- */
  [data-theme="amber"]{
    --bg:#FDF6ED; --bg-2:#F7EAD5; --surface:#FFFFFF; --surface-2:#F9EFDD; --surface-3:#F0DFBE;
    --border:#E8CFA0; --border-soft:#F0DFBE;
    --accent:#B45309; --accent-2:#9A3412; --accent-soft:#B45309; --accent-dim:#E3B77A; --accent-ink:#F7E6CC;
    --grad-accent: linear-gradient(135deg, #92400E 0%, #C2680C 50%, #EAB308 100%);
    --text:#2B1C0C; --text-dim:#6B5539; --text-faint:#A28D6E;
    --green:#4D7C0F; --green-soft:#EEF5DC; --green-line:#BBD98A;
    --rose:#B91C1C; --rose-soft:#FBE5E1; --rose-line:#E6A79F;
    --blue:#0E7490; --amber:#B45309; --amber-soft:#FBEAC7; --teal:#0F766E;
    --header-bg: rgba(253,246,237,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#F7EAD5;
  }
  /* --- Lavanta Tema (yumuşak mor, sakin gece okuması) --- */
  [data-theme="lavender"]{
    --bg:#F7F5FC; --bg-2:#EEEAF8; --surface:#FFFFFF; --surface-2:#F1EDFA; --surface-3:#E3DBF3;
    --border:#D9CCF0; --border-soft:#E3DBF3;
    --accent:#6D28D9; --accent-2:#A21CAF; --accent-soft:#6D28D9; --accent-dim:#C4B0EC; --accent-ink:#EEE6FB;
    --grad-accent: linear-gradient(135deg, #5B21B6 0%, #8B5CF6 50%, #D946EF 100%);
    --text:#241B3A; --text-dim:#5C527A; --text-faint:#9489B0;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#DB2777; --rose-soft:#FCE8F1; --rose-line:#F1AFD1;
    --blue:#4338CA; --amber:#B45309; --amber-soft:#FBEAC7; --teal:#0D9488;
    --header-bg: rgba(247,245,252,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#EEEAF8;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body, .surface, .surface-2, .surface-3, header, .menu-dropdown, .choice-btn, .seg-btn, .chip-btn, .btn-ghost{
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }
  body{background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; letter-spacing:-.01em;}
  body{
    background-image:
      radial-gradient(circle at 12% -8%, rgba(124,58,237,0.08), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(219,39,119,0.06), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(13,148,136,0.05), transparent 45%);
    background-attachment:fixed;
  }
  .font-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-weight:500; line-height:1.7;}
  .hairline{border-color:var(--border);}
  .surface{background:var(--surface); border:1px solid var(--border); box-shadow:0 1px 2px rgba(20,20,40,.04);}
  .surface-2{background:var(--surface-2); border:1px solid var(--border-soft);}
  .surface-3{background:var(--surface-3); border:1px solid var(--border-soft);}
  ::selection{background:var(--accent); color:#fff;}
  .scrollbar-thin::-webkit-scrollbar{height:6px; width:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
  input:focus, button:focus{outline:2px solid var(--accent); outline-offset:2px;}
  .accent-text{background:var(--grad-accent); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .btn-accent{background:var(--grad-accent); color:#fff; font-weight:800; box-shadow:0 10px 24px -10px rgba(124,58,237,.55);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-accent:disabled{opacity:.32; cursor:not-allowed; filter:none; box-shadow:none;}
  .btn-ghost{background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text); font-weight:600;}
  .btn-ghost:hover{border-color:var(--border);}
  .tag{border:1px solid var(--border); background:var(--surface-2); font-size:.7rem; padding:.15rem .55rem; border-radius:999px; color:var(--text-dim);}

  .menu-trigger{background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text); width:38px; height:38px;}
  .menu-trigger:hover{border-color:var(--accent-dim); background:var(--surface-3);}
  .menu-dropdown{background:var(--menu-bg); border:1px solid var(--border); box-shadow:0 24px 48px -14px rgba(20,20,40,.22);}
  .menu-item{color:var(--text-dim); transition:background .12s ease, color .12s ease;}
  .menu-item:hover{background:var(--surface-2); color:var(--text);}
  .menu-item.active{color:var(--accent); background:var(--accent-ink);}

  .seg-btn{border:1px solid var(--border-soft); color:var(--text-dim); background:var(--surface-2); transition:all .15s ease; font-weight:700;}
  .seg-btn.active{border-color:transparent; color:#fff; background:var(--grad-accent);}
  .seg-btn:hover:not(.active){color:var(--text); border-color:var(--border);}

  .chip-btn{border:1px solid var(--border-soft); color:var(--text-dim); background:var(--surface-2); transition:all .15s ease;}
  .chip-btn.active{border-color:var(--accent-dim); color:var(--accent); background:var(--accent-ink);}
  .chip-btn:hover:not(.active){color:var(--text);}

  .choice-btn{border:1.5px solid var(--border-soft); background:var(--surface-2); transition:all .12s ease; text-align:left; color:var(--text);}
  .choice-btn:hover:not(:disabled){border-color:var(--accent-dim); background:var(--surface-3);}
  .choice-btn:disabled{cursor:default;}
  .choice-btn.is-correct{border-color:var(--green-line); background:var(--green-soft); color:var(--green);}
  .choice-btn.is-wrong{border-color:var(--rose-line); background:var(--rose-soft); color:var(--rose);}
  .glossary-word{position:relative; color:var(--accent); font-weight:700; cursor:pointer; border-bottom:1.5px dotted var(--accent-dim);}
  .glossary-tooltip{
    position:absolute; bottom:125%; left:50%; transform:translateX(-50%) translateY(4px);
    background:var(--text); color:var(--bg); font-size:11px; font-weight:500; line-height:1.4;
    padding:7px 11px; border-radius:9px; white-space:normal; width:max-content; max-width:190px;
    opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease; z-index:30; text-align:center;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.35);
  }
  .glossary-tooltip.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }

  @keyframes flashGreen{0%{background-color:rgba(15,157,99,.10)}100%{background-color:transparent}}
  @keyframes flashRose{0%{background-color:rgba(225,29,72,.10)}100%{background-color:transparent}}
  .flash-correct{animation:flashGreen .8s ease-out;}
  .flash-wrong{animation:flashRose .8s ease-out;}
  .card-enter{animation:cardIn .3s ease both;}
  @keyframes cardIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
  .progress-track{background:var(--surface-2); border:1px solid var(--border-soft);}
  .progress-fill{background:var(--grad-accent);}
  .badge-circle{width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; background:var(--surface-2); border:1px solid var(--border-soft);}
  .hero-card{position:relative; overflow:hidden;}
  .hero-card::before{content:""; position:absolute; inset:0; background:
     radial-gradient(circle at 20% 10%, rgba(124,58,237,0.09), transparent 55%),
     radial-gradient(circle at 90% 90%, rgba(219,39,119,0.07), transparent 50%);
     pointer-events:none;}
  h1,h2,h3{letter-spacing:-.02em;}
  @media (max-width: 640px){ .font-ar-lg{font-size:2rem !important;} }

  /* --- Dokunma / basma animasyonu --- */
  button{ transition: transform .12s cubic-bezier(.34,1.4,.64,1), filter .12s ease, box-shadow .12s ease; }
  button:active:not(:disabled){ transform: scale(.95); }

  /* --- Menü paneli: aşağı doğru açılan animasyon --- */
  .menu-dropdown{
    position: fixed;
    top: 70px;
    right: 16px;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform-origin: top right;
    transform: translateY(-10px) scale(.94);
    opacity: 0;
    pointer-events: none;
    transition: transform .22s cubic-bezier(.2,.9,.32,1.25), opacity .16s ease;
  }
  .menu-dropdown.open{ transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
  .menu-item{ transition: background .12s ease, color .12s ease, transform .1s ease; }

  /* --- Sınav geri bildirim animasyonları --- */
  @keyframes popCheck{0%{transform:scale(.5) rotate(-8deg); opacity:0} 55%{transform:scale(1.12) rotate(2deg); opacity:1} 100%{transform:scale(1) rotate(0);}}
  @keyframes shakeX{0%,100%{transform:translateX(0)} 15%{transform:translateX(-10px)} 32%{transform:translateX(9px)} 50%{transform:translateX(-7px)} 68%{transform:translateX(6px)} 85%{transform:translateX(-3px)}}
  .anim-correct{animation:shakeX 0s;} /* no-op placeholder, real correct card uses popCheck on icon */
  .anim-wrong-card{animation:shakeX .45s ease;}
  .result-icon{width:56px;height:56px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto;animation:popCheck .38s cubic-bezier(.2,.9,.3,1.3) both;}
  .result-icon.ok{background:var(--green-soft); color:var(--green);}
  .result-icon.bad{background:var(--rose-soft); color:var(--rose);}

  /* --- Giriş ekranı --- */
  .welcome-orb{width:84px;height:84px;border-radius:28px; background:var(--grad-accent); box-shadow:0 18px 40px -14px rgba(124,58,237,.5);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  .fade-up{animation:fadeUp .35s ease both;}

  /* --- Kelime kartı (tek kart, kaydırmalı) --- */
  .flash-card{ border-radius:2.25rem; }
  @keyframes cardSlideInRight{from{transform:translateX(36px); opacity:0} to{transform:translateX(0); opacity:1}}
  @keyframes cardSlideInLeft{from{transform:translateX(-36px); opacity:0} to{transform:translateX(0); opacity:1}}
  .card-slide-in-right{animation:cardSlideInRight .28s cubic-bezier(.2,.8,.3,1) both;}
  .card-slide-in-left{animation:cardSlideInLeft .28s cubic-bezier(.2,.8,.3,1) both;}

  /* --- Sayfa geçiş animasyonu (her view değişiminde) --- */
  /* Not: transform KULLANILMAZ — #app'e transform uygulamak, içindeki
     position:fixed elemanların (ör. giriş ekranı) viewport yerine #app'e
     göre konumlanmasına neden olur ve tam ekran ortalamayı bozar. */
  @keyframes viewFadeIn{from{opacity:0} to{opacity:1}}
  .view-transition{animation:viewFadeIn .22s ease both;}

  /* --- Genel dokunma/tıklama geri bildirimi (tüm butonlar) --- */
  button{ transition: transform .12s ease, opacity .12s ease, box-shadow .12s ease; }
  button:not(:disabled):active{ transform: scale(.95); }

  /* --- Favori kalp animasyonu --- */
  [data-fav-card]{ display:inline-block; transition: transform .18s cubic-bezier(.3,1.6,.5,1); }
  @keyframes heartPop{0%{transform:scale(1)} 35%{transform:scale(1.5) rotate(-6deg)} 60%{transform:scale(.88)} 100%{transform:scale(1)}}
  [data-fav-card].heart-pop{ animation: heartPop .42s cubic-bezier(.3,1.4,.4,1) both; }

  /* --- Streak / seri alevi hafif nabız animasyonu --- */
  @keyframes flamePulse{0%,100%{transform:scale(1); filter:brightness(1)} 50%{transform:scale(1.12); filter:brightness(1.15)}}
  .streak-flame{ display:inline-block; animation: flamePulse 1.6s ease-in-out infinite; }

  /* --- Kurucu paneli açılış animasyonu --- */
  @keyframes panelIn{from{opacity:0; transform:scale(.96) translateY(-4px)} to{opacity:1; transform:scale(1) translateY(0)}}
  .panel-in{ animation: panelIn .25s cubic-bezier(.2,.85,.3,1) both; }

  /* --- Kelime kartı hover/aktif hafif kaldırma --- */
  .surface{ transition: transform .16s ease, box-shadow .16s ease; }

  /* --- Skeleton yükleniyor efekti (kurucu söz yayınlanırken vb.) --- */
  @keyframes skeletonShimmer{0%{background-position:-200px 0} 100%{background-position:calc(200px + 100%) 0}}
  .skeleton{ background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 50%, var(--surface-2) 100%); background-size:200px 100%; animation: skeletonShimmer 1.2s ease-in-out infinite; border-radius:12px; }
</style>
</head>
<body class="min-h-screen">

<div id="toast-region" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

<header id="app-header" class="border-b hairline sticky top-0 z-40" style="background:var(--header-bg); backdrop-filter:blur(10px);">
  <div class="max-w-lg mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
    <button onclick="navigate('dashboard')" class="flex items-center gap-2.5 text-left">
      <svg width="34" height="34" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="logoGradSm" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6366F1"/><stop offset="55%" stop-color="#A855F7"/><stop offset="100%" stop-color="#EC4899"/>
        </linearGradient></defs>
        <path d="M24 3 L42 17 L24 45 L6 17 Z" fill="url(#logoGradSm)"/>
        <path d="M24 3 L42 17 L24 21 Z" fill="#ffffff" opacity="0.28"/>
        <path d="M6 17 L24 21 L24 45 Z" fill="#000000" opacity="0.10"/>
      </svg>
      <div class="leading-tight">
        <div class="font-ar font-extrabold text-base leading-none" dir="rtl">كنوز</div>
        <div class="text-[10px] text-[color:var(--text-faint)] mt-1">Künûz · Kelime Hazinesi</div>
      </div>
    </button>

    <div class="flex items-center gap-2">
      <button id="theme-toggle" class="menu-trigger flex items-center justify-center rounded-full text-base leading-none" aria-label="Tema">🌙</button>
      <div class="relative">
        <button id="menu-toggle" class="menu-trigger flex items-center justify-center rounded-full text-xl leading-none" aria-label="Menü">⋮</button>
        <div id="menu-dropdown" class="menu-dropdown w-64 rounded-2xl z-50"></div>
      </div>
    </div>
  </div>
</header>

<main id="app" class="max-w-lg mx-auto px-4 py-5 pb-16"></main>

<!-- ============================= FIREBASE (ücretsiz, gerçek zamanlı veritabanı) =============================
     Kurucu sözlerinin TÜM kullanıcılara anlık gitmesi ve hesap/profil sisteminin çalışması için
     ücretsiz bir Firebase projesi kurman gerekiyor (kredi kartı istemez, dakikalar sürer):
       1) https://console.firebase.google.com adresine git, Google hesabınla gir.
       2) "Add project" ile yeni bir proje oluştur (adını istediğin gibi ver, ör. "kunuz-app").
       3) Sol menüden "Databases & Storage > Firestore" (bazı hesaplarda "Build > Firestore Database"
          olarak görünebilir) -> "Create database" -> bir konum seç -> güvenlik modu olarak
          "production mode / kilitli mod" seç.
       4) Firestore "Rules" sekmesine gidip aşağıdaki kuralları yapıştır ve "Publish" de:
            rules_version = '2';
            service cloud.firestore {
              match /databases/{database}/documents {
                match /oncuSozler/{docId} {
                  allow read: if true;

/* Yeni kelime için tahmini seviye: aynı türdeki mevcut kelimelerin ortalama
   seviyesi + kelime uzunluğuna göre hafif ayar. Kesin bir yapay zekâ analizi
   değil, veri setindeki örüntüye dayanan şeffaf bir tahmindir. */
const LEVEL_RANK = {A1:1, A2:2, B1:3, B2:4, C1:5};
const RANK_TO_LEVEL = ['A1','A2','B1','B2','C1'];
function estimateWordLevel(arabicWord, category){
  const letterCount = (arabicWord||'').replace(/[\u064B-\u0652\u0670\u0640\s]/g,'').length;
  const sameCategory = ARABIC_WORDS.filter(w=>w.category===category);
  let base;
  if(sameCategory.length>0){
    base = sameCategory.reduce((sum,w)=>sum+LEVEL_RANK[w.level],0)/sameCategory.length;
  } else {
    base = 3;
  }
  let lenAdj = 0;
  if(letterCount<=3) lenAdj=-0.6;
  else if(letterCount<=5) lenAdj=0;
  else if(letterCount<=7) lenAdj=0.5;
  else lenAdj=1.1;
  let rank = Math.round(base + lenAdj*0.5);
  rank = Math.max(1, Math.min(5, rank));
  return RANK_TO_LEVEL[rank-1];
}

const HIJRI_MONTHS = ['Muharrem','Safer','Rebiülevvel','Rebiülahir','Cemaziyelevvel','Cemaziyelahir','Recep','Şaban','Ramazan','Şevval','Zilkade','Zilhicce'];
// Tablo tabanlı (Kuveyt algoritması) hesaplamayı gerçek/gözlemsel takvime yakınlaştırmak için
// sabit gün düzeltmesi: 9 Eylül 2026 -> 27 Rebiülevvel 1448 olacak şekilde kalibre edildi.
const HIJRI_OFFSET = 1;
function gregorianToJDN(y,m,d){
  const a = Math.floor((14-m)/12);
  const y2 = y + 4800 - a;
  const m2 = m + 12*a - 3;
  return d + Math.floor((153*m2+2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045;
}
function jdnToHijri(jdn){
  let l = jdn - 1948440 + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  return {year, month, day};
}
function getHijriDate(date){
  const jdn = gregorianToJDN(date.getFullYear(), date.getMonth()+1, date.getDate()) + HIJRI_OFFSET;
  const h = jdnToHijri(jdn);
  return {year:h.year, monthIndex:h.month, day:h.day, monthName:HIJRI_MONTHS[h.month-1]};
}
function formatHijriDate(date){
  const h = getHijriDate(date);
  return `${h.day} ${h.monthName} ${h.year}`;
}

const DTR=Math.PI/180, RTD=180/Math.PI;
const dsin=d=>Math.sin(d*DTR), dcos=d=>Math.cos(d*DTR), dtan=d=>Math.tan(d*DTR);
const darcsin=x=>RTD*Math.asin(x), darccos=x=>RTD*Math.acos(x);
const darctan2=(y,x)=>RTD*Math.atan2(y,x), darccot=x=>RTD*Math.atan(1/x);
const fixAngle=a=>{ a=a%360; return a<0?a+360:a; };
const fixHour=a=>{ a=a%24; return a<0?a+24:a; };
function julianDate(y,m,d){
  if(m<=2){ y-=1; m+=12; }
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPosition(jd){
  const D = jd - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028*D);
  const q = fixAngle(280.459 + 0.98564736*D);
  const L = fixAngle(q + 1.915*dsin(g) + 0.020*dsin(2*g));
  const e = 23.439 - 0.00000036*D;
  let RA = darctan2(dcos(e)*dsin(L), dcos(L))/15;
  RA = fixHour(RA);
  const eqt = q/15 - RA;
  const decl = darcsin(dsin(e)*dsin(L));
  return {decl, eqt};
}
function sunHourAngle(angle, lat, decl){
  const ratio = (-dsin(angle) - dsin(decl)*dsin(lat)) / (dcos(decl)*dcos(lat));
  if(ratio>1||ratio<-1) return null;
  return darccos(ratio)/15;
}
function asrHourAngle(factor, lat, decl){
  const a = -darccot(factor + dtan(Math.abs(lat-decl)));
  return sunHourAngle(a, lat, decl);
}
function computePrayerTime(jDate, lon, tz, lat, angleFn, guessHour, isBefore){
  let t = guessHour;
  for(let i=0;i<2;i++){
    const jdt = jDate + t/24;
    const sp = sunPosition(jdt);
    const noon = fixHour(12 - lon/15 - sp.eqt + tz);
    const hAngle = angleFn(sp.decl);
    if(hAngle===null) return null;
    t = isBefore ? noon - hAngle : noon + hAngle;
  }
  return t;
}
function prayerTimesFor(date, lat, lon, tz){
  const asrFactor = 2; // Hanefi
  const jDate = julianDate(date.getFullYear(), date.getMonth()+1, date.getDate());
  const fajr    = computePrayerTime(jDate, lon, tz, lat, decl=>sunHourAngle(18, lat, decl), 5, true);
  const sunrise = computePrayerTime(jDate, lon, tz, lat, decl=>sunHourAngle(0.833, lat, decl), 6, true);
  const dhuhr   = computePrayerTime(jDate, lon, tz, lat, ()=>0, 12, false);
  const asr     = computePrayerTime(jDate, lon, tz, lat, decl=>asrHourAngle(asrFactor, lat, decl), 15.5, false);
  const maghrib = computePrayerTime(jDate, lon, tz, lat, decl=>sunHourAngle(0.833, lat, decl), 18, false);
  const isha    = computePrayerTime(jDate, lon, tz, lat, decl=>sunHourAngle(17, lat, decl), 19, false);
  /* Diyanet "temkin" (resmi güvenlik payı) düzeltmeleri uygulanır — bu düzeltmeler olmadan
     saf astronomik hesap resmi takvimden birkaç dakika sapar. Kaynak: Diyanet İşleri Başkanlığı
     resmi açıklaması (vakithesaplama.diyanet.gov.tr/temkin.php):
     - Güneş doğuşu: gerçek doğuştan 7 dk ÖNCESİ gösterilir
     - Akşam (Mağrib): gerçek batıştan 7 dk SONRASI gösterilir
     - Öğle: gerçek zevalden 5 dk sonra başlar
     - İkindi: hesaba 4 dk eklenir
     - İmsak ve Yatsı: temkin uygulanmaz (fıkhen ihtiyaç görülmemiştir) */
  return {
    fajr,
    sunrise: sunrise!==null ? sunrise - 7/60 : null,
    dhuhr:   dhuhr!==null   ? dhuhr   + 5/60 : null,
    asr:     asr!==null     ? asr     + 4/60 : null,
    maghrib: maghrib!==null ? maghrib + 7/60 : null,
    isha,
  };
}
function hoursToClock(h){
  if(h===null||h===undefined) return '—';
  h = fixHour(h);
  let hh = Math.floor(h), mm = Math.round((h-hh)*60);
  if(mm===60){ mm=0; hh=(hh+1)%24; }
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
const PRAYER_ORDER = [['fajr','İmsak'],['sunrise','Güneş'],['dhuhr','Öğle'],['asr','İkindi'],['maghrib','Akşam'],['isha','Yatsı']];

/* ============================= NAMAZ VAKİTLERİ (Diyanet / AlAdhan API) =============================
   Astronomik hesap artık sadece API'ye ulaşılamadığında (offline vb.) yedek olarak kullanılır.
   Öncelik: AlAdhan API (method=13 → Diyanet İşleri Başkanlığı) üzerinden resmi vakitleri çekmek.
   Şehir bilgisi olan konumlarda (ör. Yalova, Bursa) timingsByCity ile doğrudan Diyanet'in
   yayınladığı resmi takvim satırı çekilir; GPS konumunda ise koordinat bazlı Diyanet metodu kullanılır. */
let diyanetFetch = {status:'idle', key:null, message:null}; // idle | loading | done | error
function pad2(n){ return String(n).padStart(2,'0'); }
function todayDateKey(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function aladhanDateParam(){
  const d = new Date();
  return `${pad2(d.getDate())}-${pad2(d.getMonth()+1)}-${d.getFullYear()}`;
}
function locKey(loc){
  if(!loc) return null;
  return loc.city ? `city:${loc.city}|${loc.country||'Turkey'}` : `geo:${loc.lat.toFixed(3)},${loc.lon.toFixed(3)}`;
}
function parseClockToHours(str){
  if(!str) return null;
  const clean = String(str).split(' ')[0]; // "HH:MM (+03)" -> "HH:MM"
  const parts = clean.split(':');
  const h = Number(parts[0]), m = Number(parts[1]);
  if(Number.isNaN(h)||Number.isNaN(m)) return null;
  return h + m/60;
}
function getDiyanetCache(loc){
  if(!loc) return null;
  const cache = LS.get('diyanetCache', {});
  const entry = cache[locKey(loc)];
  if(entry && entry.date===todayDateKey()) return entry.times;
  return null;
}
function setDiyanetCache(loc, times){
  const cache = LS.get('diyanetCache', {});
  cache[locKey(loc)] = {date:todayDateKey(), times};
  LS.set('diyanetCache', cache);
}
async function fetchDiyanetTimes(loc){
  const dateParam = aladhanDateParam();
  const url = loc.city
    ? `https://api.aladhan.com/v1/timingsByCity/${dateParam}?city=${encodeURIComponent(loc.city)}&country=${encodeURIComponent(loc.country||'Turkey')}&method=13`
    : `https://api.aladhan.com/v1/timings/${dateParam}?latitude=${loc.lat}&longitude=${loc.lon}&method=13`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Sunucu hatası: '+res.status);
  const data = await res.json();
  if(!data || data.code!==200 || !data.data || !data.data.timings) throw new Error('Beklenmeyen API yanıtı');
  const t = data.data.timings;
  return {
    fajr:    parseClockToHours(t.Fajr),
    sunrise: parseClockToHours(t.Sunrise),
    dhuhr:   parseClockToHours(t.Dhuhr),
    asr:     parseClockToHours(t.Asr),
    maghrib: parseClockToHours(t.Maghrib),
    isha:    parseClockToHours(t.Isha),
  };
}
function ensureDiyanetTimes(loc){
  if(!loc) return;
  const key = locKey(loc);
  if(getDiyanetCache(loc)){ diyanetFetch = {status:'done', key, message:null}; return; }
  if(diyanetFetch.status==='loading' && diyanetFetch.key===key) return;
  diyanetFetch = {status:'loading', key, message:null};
  fetchDiyanetTimes(loc).then(times=>{
    setDiyanetCache(loc, times);
    diyanetFetch = {status:'done', key, message:null};
    if(currentView==='prayertimes' || currentView==='dashboard') renderApp();
  }).catch(err=>{
    diyanetFetch = {status:'error', key, message: err.message || 'Bağlantı hatası'};
    if(currentView==='prayertimes') renderApp();
  });
}
function getTodayPrayerTimes(){
  const s = state();
  if(!s.prayerLoc) return null;
  const cached = getDiyanetCache(s.prayerLoc);
  if(cached) return cached;
  ensureDiyanetTimes(s.prayerLoc); // arka planda Diyanet verisini çek, hazır olunca renderApp() tetiklenir
  const tz = -(new Date().getTimezoneOffset())/60;
  return prayerTimesFor(new Date(), s.prayerLoc.lat, s.prayerLoc.lon, tz);
}
function getPrayerTimesMeta(){
  const s = state();
  if(!s.prayerLoc) return null;
  if(getDiyanetCache(s.prayerLoc)) return {source:'diyanet'};
  if(diyanetFetch.status==='loading') return {source:'loading'};
  if(diyanetFetch.status==='error') return {source:'fallback', message: diyanetFetch.message};
  return {source:'fallback'};
}
function getNextPrayer(times){
  if(!times) return null;
  const now = new Date();
  const nowH = now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  for(const [key] of PRAYER_ORDER){
    if(times[key]!==null && times[key]>nowH) return {key, hours:times[key], tomorrow:false};
  }
  return {key:'fajr', hours:times.fajr, tomorrow:true};
}
function formatCountdown(targetHours, tomorrow){
  const now = new Date();
  const nowH = now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  let diff = targetHours - nowH + (tomorrow?24:0);
  if(diff<0) diff+=24;
  const h = Math.floor(diff), m = Math.floor((diff-h)*60);
  return `${h} sa ${m} dk`;
}
let prayerTickInterval = null;
function stopPrayerTick(){ if(prayerTickInterval){ clearInterval(prayerTickInterval); prayerTickInterval=null; } }
function requestPrayerLocation(){
  if(!navigator.geolocation){ toast('Cihazın konum servisi bulunamadı.'); return; }
  const btn = document.getElementById('btn-get-location') || document.getElementById('btn-refresh-location');

    pos=>{ LS.set('prayerLoc', {lat:pos.coords.latitude, lon:pos.coords.longitude, label:'Cihaz Konumu', source:'gps', obtainedAt:Date.now()}); renderApp(); },
    err=>{ toast('Konum alınamadı. Yerine Yalova ya da Bursa seçebilirsin.'); renderApp(); },
    {timeout:10000}
  );
}

/* ============================= KIBLE YÖNÜ =============================
   Kâbe'nin koordinatlarına göre büyük daire (great-circle) açısı hesaplanır.
   Aynı konum (prayerLoc) namaz vakitleri ile paylaşılır. */
const KAABA_LAT = 21.4225, KAABA_LON = 39.8262;
function toRad(d){ return d*Math.PI/180; }
function toDeg(r){ return r*180/Math.PI; }
function calculateQiblaBearing(lat, lon){
  const φ1=toRad(lat), φ2=toRad(KAABA_LAT), Δλ=toRad(KAABA_LON-lon);
  const y = Math.sin(Δλ)*Math.cos(φ2);
  const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function calculateQiblaDistanceKm(lat, lon){
  const R=6371;
  const φ1=toRad(lat), φ2=toRad(KAABA_LAT), Δφ=toRad(KAABA_LAT-lat), Δλ=toRad(KAABA_LON-lon);
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}
function compassDirectionName(deg){
  const dirs=['Kuzey','Kuzeydoğu','Doğu','Güneydoğu','Güney','Güneybatı','Batı','Kuzeybatı'];
  return dirs[Math.round(deg/45)%8];
}
/* --- Canlı pusula: cihazın magnetometre/yönelim sensörüyle anlık takip --- */
let compassActive = false;
let compassHeading = null;
let compassPermissionState = 'unknown'; // unknown | granted | denied | unsupported
function isIOSOrientationPermissionNeeded(){
  return typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
}
function handleQiblaOrientation(e){
  let heading = null;
  if(typeof e.webkitCompassHeading === 'number') heading = e.webkitCompassHeading; // iOS: zaten pusula açısı
  else if(e.alpha != null) heading = (360 - e.alpha) % 360; // Android yaklaşık dönüşüm
  if(heading==null || Number.isNaN(heading)) return;
  compassHeading = heading;
  updateQiblaRoseRotation();
}
function updateQiblaRoseRotation(){
  const rose = document.getElementById('qibla-rose');
  if(!rose || compassHeading==null) return;
  rose.style.transform = `rotate(${(-compassHeading).toFixed(1)}deg)`;
  const label = document.getElementById('qibla-heading-label');
  if(label) label.textContent = Math.round(compassHeading)+'°';
}
async function enableQiblaCompass(){
  if(typeof DeviceOrientationEvent === 'undefined'){ compassPermissionState='unsupported'; renderApp(); return; }
  try{
    if(isIOSOrientationPermissionNeeded()){
      const result = await DeviceOrientationEvent.requestPermission();
      if(result !== 'granted'){ compassPermissionState='denied'; renderApp(); return; }
    }
    compassPermissionState = 'granted';
    compassActive = true;
    window.addEventListener('deviceorientationabsolute', handleQiblaOrientation, true);
    window.addEventListener('deviceorientation', handleQiblaOrientation, true);
    renderApp();
  }catch(e){ compassPermissionState='denied'; renderApp(); }
}
function disableQiblaCompass(){
  compassActive = false;
  window.removeEventListener('deviceorientationabsolute', handleQiblaOrientation, true);
  window.removeEventListener('deviceorientation', handleQiblaOrientation, true);
}

    : compassPermissionState==='unsupported'
      ? `<div class="text-[11px] text-center text-[color:var(--text-faint)]">Bu cihaz/tarayıcı canlı pusula sensörünü desteklemiyor. Aşağıdaki statik açıyla elle bulabilirsin.</div>`
      : '';
  return `
  <section class="space-y-4">
    <div class="flex items-center justify-between">

      </div>
    </div>

      <div id="qibla-rose" class="relative" style="width:220px; height:220px; transition:transform .12s linear;">
        <svg viewBox="0 0 220 220" width="220" height="220">
          <circle cx="110" cy="110" r="104" fill="none" stroke="var(--border)" stroke-width="2"/>

          <text x="24" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text-faint)">B</text>
          <g transform="rotate(${bearing} 110 110)">

      </div>

        ${compassActive ? `<div class="text-[11px] text-[color:var(--text-faint)] mt-1">Pusula: <span id="qibla-heading-label">${compassHeading!=null?Math.round(compassHeading)+'°':'—'}</span></div>` : ''}
      </div>
    </div>

    ${!compassActive ? `

      📱 Telefonu düz tutarak yavaşça çevir, ok Kâbe'yi göstermeye devam edecek. Eğer ok kararsız/yanlış davranıyorsa, telefonunu havada <b>sekiz (8) çizer gibi</b> sallayarak pusulayı kalibre et — metal eşyalardan ve kılıf mıknatıslarından uzak tut.
    </div>
    `}
  </section>`;
}
function bindQiblaEvents(){
  const useBtn = document.getElementById('btn-qibla-location'); if(useBtn) useBtn.onclick = requestPrayerLocation;

function dayOfYear(d){ const start=new Date(d.getFullYear(),0,0); return Math.floor((d-start)/86400000); }
function allDailyCards(){
  const extra = firebaseReady ? remoteFounderQuotes : state().founderQuotes;
  return [...DAILY_CARDS, ...extra];
}
function getDailyCard(){
  const s = state();
  const visible = allDailyCards().filter(c=>!s.hiddenCards.includes(c.id));
  const pool = visible.length ? visible : allDailyCards();
  return pool[dayOfYear(new Date()) % pool.length];
}
let lastToggledFavId = null;
function toggleFavoriteCard(id){
  const s = state();
  const has = s.favoriteCards.includes(id);
  LS.set('favoriteCards', has ? s.favoriteCards.filter(x=>x!==id) : [...s.favoriteCards, id]);
  lastToggledFavId = has ? null : id;
  renderApp();
}
function hideCard(id){
  const s = state();
  if(!s.hiddenCards.includes(id)) LS.set('hiddenCards', [...s.hiddenCards, id]);
  renderApp();
  toast('Söz gizlendi. "🙈 Gizlenenler" filtresinden geri getirebilirsin.');
}
function unhideCard(id){
  const s = state();
  LS.set('hiddenCards', s.hiddenCards.filter(x=>x!==id));
  renderApp();
  toast('Söz geri getirildi.', 'badge');
}
function dailyCardTypeLabel(type){ return type==='ayet' ? 'Ayet' : type==='hadis' ? 'Hadis' : type==='soz' ? 'Söz' : 'Dua'; }
function dailyCardHtml(card, opts){
  opts = opts || {};
  const s = state();
  const isFav = s.favoriteCards.includes(card.id);
  const hiddenView = !!opts.hiddenView;
  return `
  <div class="surface rounded-2xl ${opts.big?'p-5':'p-4'} space-y-2.5">
    <div class="flex items-center justify-between gap-2">
      <span class="tag" style="border-color:var(--accent-dim); color:var(--accent)">${dailyCardTypeLabel(card.type)} · ${esc(card.category)}</span>
      <div class="flex items-center gap-2 shrink-0">
        ${hiddenView
          ? `<button data-unhide-card="${card.id}" class="text-[11px] font-semibold px-2 py-1 rounded-full" style="background:var(--surface-2); color:var(--accent)">↩️ Geri getir</button>`
          : `<button data-fav-card="${card.id}" class="text-lg leading-none" aria-label="Favorilere ekle">${isFav?'❤️':'🤍'}</button>
             <button data-hide-card="${card.id}" class="text-lg leading-none" aria-label="Beğenmedim, gizle" title="Beğenmedim, listemden kaldır">🚫</button>`}
      </div>
    </div>
    ${card.arabic ? `<div class="font-ar ${opts.big?'text-2xl':'text-xl'} leading-loose" dir="rtl">${esc(card.arabic)}</div>` : ''}
    <div class="${opts.big?'text-base':'text-sm'} text-[color:var(--text-dim)] leading-relaxed ${card.type==='soz'?'italic':''}">${card.type==='soz'?'“'+esc(card.turkish)+'”':esc(card.turkish)}</div>
    ${card.person ? `<div class="text-xs font-bold" style="color:var(--accent)">— ${esc(card.person)}</div>` : ''}
    <div class="text-[10px] text-[color:var(--text-faint)]">${esc(card.ref)}${card.founder?' · <span style="color:var(--accent)">Kurucu eklemesi</span>':''}</div>
  </div>`;
}

function renderDailyCardView(){
  const s = state();
  const cards = allDailyCards();
  const visible = cards.filter(c=>!s.hiddenCards.includes(c.id));
  const today = getDailyCard();
  const categories = [...new Set(cards.map(c=>c.category))];
  let list;
  if(dailyCardFilter==='all') list = visible;
  else if(dailyCardFilter==='favorites') list = visible.filter(c=>s.favoriteCards.includes(c.id));
  else if(dailyCardFilter==='hidden') list = cards.filter(c=>s.hiddenCards.includes(c.id));
  else list = visible.filter(c=>c.category===dailyCardFilter);
  const hiddenView = dailyCardFilter==='hidden';
  const founder = isFounder();
  return `
  <section class="space-y-4">
    <div class="flex items-start justify-between gap-2">
      <div><h2 class="font-extrabold text-lg">Ayet, Hadis & Dua</h2><p class="text-xs text-[color:var(--text-dim)] mt-0.5">Günün kartı, kategoriler ve favorilerin</p></div>
      ${founder ? '' : renderFounderLockedEntry()}
    </div>

    ${founder ? renderFounderAddForm() : ''}

    <div>
      <div class="text-[11px] text-[color:var(--text-faint)] mb-2 font-semibold uppercase tracking-wide">Bugünün Kartı</div>
      ${dailyCardHtml(today, {big:true})}

    <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto scrollbar-thin pr-1">
      <button data-card-filter="all" class="chip-btn ${dailyCardFilter==='all'?'active':''} px-3 py-1.5 rounded-full text-xs">Tümü</button>
      <button data-card-filter="favorites" class="chip-btn ${dailyCardFilter==='favorites'?'active':''} px-3 py-1.5 rounded-full text-xs">❤️ Favoriler</button>
      ${s.hiddenCards.length ? `<button data-card-filter="hidden" class="chip-btn ${dailyCardFilter==='hidden'?'active':''} px-3 py-1.5 rounded-full text-xs">🙈 Gizlenenler</button>` : ''}
      ${categories.map(c=>`<button data-card-filter="${esc(c)}" class="chip-btn ${dailyCardFilter===c?'active':''} px-3 py-1.5 rounded-full text-xs">${esc(c)}</button>`).join('')}
    </div>

    <div class="space-y-2.5">
      ${list.length ? list.map(c=>dailyCardHtml(c, {hiddenView})).join('') : `<div class="surface rounded-2xl p-6 text-center text-sm text-[color:var(--text-faint)]">${dailyCardFilter==='favorites'?'Henüz favori kartın yok. Beğendiğin kartlarda 🤍 ikonuna dokun.':dailyCardFilter==='hidden'?'Gizlediğin bir söz yok.':'Bu kategoride kart yok.'}</div>`}
    </div>
  </section>`;
}
function unlockFounderPrompt(){
  const pass = window.prompt('Kurucu parolasını gir:');
  if(pass === null) return;
  if(pass === FOUNDER_PASSWORD){ LS.set('founderUnlocked', true); renderApp(); }
  else toast('Parola yanlış.');
}
function lockFounder(){ LS.set('founderUnlocked', false); if(firebaseReady && auth && auth.currentUser) auth.signOut(); renderApp(); }
function addFounderQuote(){
  const person = (document.getElementById('founder-input-person')?.value || '').trim();
  const text = (document.getElementById('founder-input-text')?.value || '').trim();
  const ref = (document.getElementById('founder-input-ref')?.value || '').trim();
  if(!person || !text){ toast('Yazar adı ve söz metni zorunludur.'); return; }
  if(firebaseReady && db){
    founderAddBusy = true; renderApp();
    db.collection('oncuSozler').add({
      person, turkish:text, ref: ref || (person + ' — kurucu tarafından eklendi'), founder:true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{ founderAddBusy = false; renderApp(); toast('✅ Söz yayınlandı — tüm kullanıcılara gidiyor!', 'badge'); })
      .catch(err=>{ founderAddBusy = false; toast('Yayınlanamadı: ' + err.message); renderApp(); });
    return;
  }
  const s = state();
  const id = 'founder-' + Date.now();
  const newQuote = { id, type:'soz', category:'Öncü Şahsiyetler', person, turkish:text, ref: ref || (person + ' — kurucu tarafından eklendi'), founder:true };
  LS.set('founderQuotes', [...s.founderQuotes, newQuote]);
  renderApp();
  toast('Söz eklendi (bu cihazda).', 'badge');
}
function exportFounderQuotes(){
  const s = state();
  const code = s.founderQuotes.map(q=>{
    const obj = {id:q.id, type:'soz', category:q.category, person:q.person, turkish:q.turkish, ref:q.ref};
    return '  ' + JSON.stringify(obj) + ',';
  }).join('\n') + '\n';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code)
      .then(()=> toast('Kopyalandı! DAILY_CARDS dizisine yapıştırıp siteyi yeniden yayınla.', 'badge'))
      .catch(()=> window.prompt('Kopyalamak için seç (Ctrl+C):', code));
  } else {
    window.prompt('Kopyalamak için seç (Ctrl+C):', code);
  }
}

  document.querySelectorAll('[data-fav-card]').forEach(b=>{
    b.onclick = ()=> toggleFavoriteCard(b.dataset.favCard);

/* ============================= YARDIMCI ============================= */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function normalizeArabic(s){
  return (s||'')
    .replace(/[\u064B-\u0652\u0670\u0640]/g,'')
    .replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/\s+/g,' ').trim();
}
function normalizeTr(s){
  return (s||'').toLocaleLowerCase('tr').replace(/[.,!?;:()"']/g,'').replace(/\s+/g,' ').trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}
function checkAnswer(word, direction, raw){
  const ans = (raw||'').trim();
  if(!ans) return false;
  if(direction==='tr2ar'){
    return normalizeArabic(ans) === normalizeArabic(word.arabic);
  } else {
    const target = normalizeTr(word.turkish).split('/')[0].trim();
    const given = normalizeTr(ans);
    if(given===target) return true;
    const dist = levenshtein(given,target);
    const tolerance = Math.max(1, Math.floor(target.length*0.2));
    return dist<=tolerance;
  }
}
function buildChoices(word){
  let pool = ARABIC_WORDS.filter(w=>w.id!==word.id && w.category===word.category && normalizeArabic(w.arabic)!==normalizeArabic(word.arabic));
  if(pool.length<3) pool = ARABIC_WORDS.filter(w=>w.id!==word.id && w.level===word.level && normalizeArabic(w.arabic)!==normalizeArabic(word.arabic));
  if(pool.length<3) pool = ARABIC_WORDS.filter(w=>w.id!==word.id && normalizeArabic(w.arabic)!==normalizeArabic(word.arabic));
  const distractors = pick(pool, 3).map(w=>w.arabic);
  return shuffle([word.arabic, ...distractors]);
}

/* ============================= AKILLI TEKRAR (SM-2 basitleştirilmiş) =============================
   Bir kelime ilk kez ezberlenince tekrar takibine alınır (reps:1, interval:1 gün).
   Her doğru cevapta aralık genişler (ease ile çarpılır), her yanlışta sıfırlanır (1 güne düşer).
   "due" o kelimenin bir daha ne zaman karşına çıkması gerektiğinin tarihidir (unutma eğrisine göre). */
function addDaysISO(daysFromToday){
  const d = new Date(); d.setDate(d.getDate()+daysFromToday);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function getSrsMap(){ return LS.get('srs', {}); }
function ensureSrsEntry(wordId){
  const srs = getSrsMap();
  if(!srs[wordId]){
    srs[wordId] = {ease:2.5, interval:1, reps:1, due: addDaysISO(1)};
    LS.set('srs', srs);
  }
}
function updateSrsForAnswer(wordId, correct){
  const srs = getSrsMap();
  const rec = srs[wordId];
  if(!rec) return; // henüz akıllı tekrar takibine alınmamış bir kelime (ilk öğrenme turu)
  if(correct){
    rec.reps += 1;
    if(rec.reps===1) rec.interval = 1;
    else if(rec.reps===2) rec.interval = 3;
    else rec.interval = Math.max(1, Math.round(rec.interval * rec.ease));
    rec.ease = Math.min(2.8, rec.ease + 0.05);
  } else {
    rec.reps = 0;
    rec.interval = 1;
    rec.ease = Math.max(1.3, rec.ease - 0.2);
  }
  rec.due = addDaysISO(rec.interval);
  srs[wordId] = rec;
  LS.set('srs', srs);
}
function getDueSrsWords(){
  const s = state();
  const srs = s.srs;
  const today = todayDateKey();
  return s.memorized
    .filter(id=> srs[id] && srs[id].due<=today)
    .map(id=>WORDS_BY_ID[id]).filter(Boolean)
    .sort((a,b)=> srs[a.id].due.localeCompare(srs[b.id].due));
}
function getUpcomingSrsCounts(){
  const s = state();
  const srs = s.srs;
  const today = todayDateKey();
  const tomorrow = addDaysISO(1);
  let dueToday=0, dueTomorrow=0, dueThisWeek=0;
  const weekEnd = addDaysISO(7);
  s.memorized.forEach(id=>{
    const rec = srs[id];
    if(!rec) return;
    if(rec.due<=today) dueToday++;
    else if(rec.due===tomorrow) dueTomorrow++;
    if(rec.due>today && rec.due<=weekEnd) dueThisWeek++;
  });
  return {dueToday, dueTomorrow, dueThisWeek};
}

/* ============================= RENDER: DASHBOARD (SADE ANA EKRAN) ============================= */
function progressRing(percent, size, stroke){
  size = size||128; stroke = stroke||11;
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const offset = c - (Math.max(0,Math.min(100,percent))/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/><stop offset="55%" stop-color="#C084FC"/><stop offset="100%" stop-color="#F472B6"/>
    </linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--surface-2)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="url(#ringGrad)" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"/>
  </svg>`;
}
const TIERS = [
  {count:0,    label:'Avâm'},
  {count:250,  label:'Talebe'},
  {count:500,  label:'Hafız'},
  {count:1000, label:'Müderris'},
  {count:1500, label:'Muallim'},
  {count:2000, label:'Hoca'},
  {count:3000, label:'Âlim'},
];
function getTierProgress(learned){
  let idx = 0;
  for(let i=0;i<TIERS.length;i++){ if(learned>=TIERS[i].count) idx=i; }
  const cur = TIERS[idx];
  const next = TIERS[idx+1] || TIERS[idx];
  const span = next.count - cur.count;
  const frac = span>0 ? Math.min(1,(learned-cur.count)/span) : 1;
  return {cur, next, frac};
}
function renderDashboard(){

  const learned = s.memorized.length;
  const remaining = total-learned;
  const hardCount = Object.keys(s.hard).length;
  const cp = s.checkpoint;
  const tier = getTierProgress(learned);
  const todayGregorian = new Date().toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'});
  const todayHijri = formatHijriDate(new Date());

function renderHeatmap(){
  const log = state().dailyLog;
  const today = new Date();
  const days = [];
  for(let i=34;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    days.push({date:d, count: log[d.toDateString()]||0});
  }
  const startPad = (days[0].date.getDay()+6)%7; // Pazartesi=0 .. Pazar=6
  function colorFor(c){ if(c===0) return 'var(--surface-2)'; if(c<5) return '#D9CBFB'; if(c<10) return '#B69EF7'; return 'var(--accent)'; }
  const padCells = Array(startPad).fill('<div></div>').join('');
  const dayCells = days.map(d=>`<div title="${d.date.toLocaleDateString('tr-TR')} — ${d.count} kelime" style="aspect-ratio:1; border-radius:4px; background:${colorFor(d.count)}"></div>`).join('');
  const totalThisWeek = days.slice(-7).reduce((a,d)=>a+d.count,0);
  let bestIdx = 0;
  days.forEach((d,i)=>{ if(d.count>days[bestIdx].count) bestIdx=i; });
  const bestLabel = days[bestIdx].count>0 ? days[bestIdx].date.toLocaleDateString('tr-TR',{weekday:'long'}) : null;
  return `
  <div class="surface rounded-2xl p-4">
    <div class="flex items-center justify-between mb-3">
      <div class="text-[11px] font-bold text-[color:var(--text-faint)] uppercase tracking-wide">Son 5 Hafta</div>
      <div class="text-[11px] text-[color:var(--text-dim)]">Bu hafta: <b class="text-[color:var(--text)]">${totalThisWeek}</b> kelime</div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px;">${padCells}${dayCells}</div>
    ${bestLabel ? `<div class="text-[11px] text-[color:var(--text-faint)] mt-3">En verimli günün: <b class="text-[color:var(--text-dim)]">${bestLabel}</b></div>` : ''}
  </div>`;
}

  const btn = document.getElementById('btn-get-location');
  if(btn) btn.onclick = requestPrayerLocation;
  const refreshBtn = document.getElementById('btn-refresh-location');
  if(refreshBtn) refreshBtn.onclick = requestPrayerLocation;
  const retryBtn = document.getElementById('btn-retry-diyanet');
  if(retryBtn) retryBtn.onclick = ()=>{ diyanetFetch = {status:'idle', key:null, message:null}; renderApp(); };
  stopPrayerTick();
  const times = getTodayPrayerTimes();
  if(times){
    prayerTickInterval = setInterval(()=>{
      const el = document.getElementById('prayer-countdown');
      if(!el){ stopPrayerTick(); return; }
      const next = getNextPrayer(times);
      el.textContent = formatCountdown(next.hours, next.tomorrow);
    }, 1000);
  }
}

function updateLevelPreview(){
  const el = document.getElementById('aw-level-preview');
  if(!el) return;
  el.textContent = (addWordDraft.arabic && addWordDraft.category) ? estimateWordLevel(addWordDraft.arabic, addWordDraft.category) : 'Arapça ve tür girince hesaplanır';
}
function bindAddWordEvents(){
  const idMap = {arabic:'aw-arabic', transliteration:'aw-translit', turkish:'aw-turkish', category:'aw-category', root:'aw-root', synonym:'aw-synonym', antonym:'aw-antonym', exampleArabic:'aw-exar', exampleTurkish:'aw-extr'};
  Object.keys(idMap).forEach(f=>{
    const el = document.getElementById(idMap[f]);
    if(el) el.addEventListener('input', ()=>{ addWordDraft[f] = el.value; updateLevelPreview(); });
  });
  document.querySelectorAll('[data-fill-category]').forEach(b=>{
    b.onclick = ()=>{
      addWordDraft.category = b.dataset.fillCategory;
      const catInput = document.getElementById('aw-category');
      if(catInput) catInput.value = b.dataset.fillCategory;
      updateLevelPreview();
    };
  });
  const saveBtn = document.getElementById('aw-save');
  if(saveBtn) saveBtn.onclick = submitAddWord;
}
function submitAddWord(){
  const d = addWordDraft;
  if(!d.arabic || !d.arabic.trim()){ toast('Arapça kelimeyi gir.'); return; }
  if(!d.turkish || !d.turkish.trim()){ toast('Türkçe anlamını gir.'); return; }
  if(!d.category || !d.category.trim()){ toast('Tür/kategori gir.'); return; }
  const level = estimateWordLevel(d.arabic, d.category);
  const newWord = addCustomWord({
    arabic: d.arabic.trim(),
    transliteration: (d.transliteration||'').trim(),
    turkish: d.turkish.trim(),
    category: d.category.trim(),
    level,
    root: (d.root||'').trim() || '-',
    synonym: (d.synonym||'').trim() || '-',
    antonym: (d.antonym||'').trim() || '-',
    exampleArabic: (d.exampleArabic||'').trim() || '-',
    exampleTurkish: (d.exampleTurkish||'').trim() || '-',
  });
  addWordDraft = {arabic:'', transliteration:'', turkish:'', category:'', root:'', synonym:'', antonym:'', exampleArabic:'', exampleTurkish:''};
  toast(`<div class="font-bold accent-text">✓ Kelime eklendi</div><div class="text-[color:var(--text-dim)] mt-0.5">${esc(newWord.arabic)} — Seviye: ${newWord.level}</div>`);
  renderApp();
}

function bindAccountEvents(){

  if(submitBtn) submitBtn.onclick = handleAuthSubmit;
  const forgotBtn = document.getElementById('auth-forgot-btn');
  if(forgotBtn) forgotBtn.onclick = handleForgotPassword;
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ if(auth) auth.signOut(); };
  const saveBtn = document.getElementById('profile-save-btn');
  if(saveBtn) saveBtn.onclick = handleProfileSave;
}
function handleForgotPassword(){
  if(!firebaseReady || !auth) return;
  const email = (document.getElementById('auth-email')?.value || '').trim();
  const errEl = document.getElementById('auth-error');
  if(!email){ if(errEl) errEl.textContent = 'Önce e-posta adresini yaz.'; return; }
  auth.sendPasswordResetEmail(email).then(()=>{
    if(errEl){ errEl.style.color = 'var(--accent)'; errEl.textContent = 'Şifre sıfırlama bağlantısı e-postana gönderildi.'; }
  }).catch(err=>{ if(errEl){ errEl.style.color = 'var(--rose)'; errEl.textContent = err.message; } });
}
let profileBusy = false;
function handleProfileSave(){
  if(!firebaseReady || !db || !currentUser) return;
  const ad = (document.getElementById('profile-edit-ad')?.value || '').trim();
  const soyad = (document.getElementById('profile-edit-soyad')?.value || '').trim();
  const msgEl = document.getElementById('profile-save-msg');
  if(!ad || !soyad){ if(msgEl) msgEl.textContent = 'Ad ve soyad boş olamaz.'; return; }
  profileBusy = true; renderApp();
  db.collection('users').doc(currentUser.uid).set({ ad, soyad, email: currentUser.email }, {merge:true}).then(()=>{
    currentUserProfile = { ...(currentUserProfile||{}), ad, soyad };
    profileBusy = false; renderApp();
    toast('Profil güncellendi.', 'badge');
  }).catch(()=>{ profileBusy = false; renderApp(); toast('Profil kaydedilemedi.'); });
}
function handleAuthSubmit(){
  if(!firebaseReady || !auth) return;
  const email = (document.getElementById('auth-email')?.value || '').trim();
  const password = (document.getElementById('auth-password')?.value || '').trim();
  const errEl = document.getElementById('auth-error');
  if(errEl){ errEl.style.color = 'var(--rose)'; errEl.textContent = ''; }
  if(!email || !password){ if(errEl) errEl.textContent = 'E-posta ve şifre zorunludur.'; return; }
  if(authMode==='signup'){
    const ad = (document.getElementById('auth-ad')?.value || '').trim();
    const soyad = (document.getElementById('auth-soyad')?.value || '').trim();
    if(!ad || !soyad){ if(errEl) errEl.textContent = 'Ad ve soyad zorunludur.'; return; }
    authBusy = true; renderApp();
    auth.createUserWithEmailAndPassword(email, password).then(cred=>{
      return db.collection('users').doc(cred.user.uid).set({ ad, soyad, email, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }).then(()=>{ authBusy = false; renderApp(); })
      .catch(err=>{ authBusy = false; const el=document.getElementById('auth-error'); if(el) el.textContent = err.message; renderApp(); });
  } else {
    authBusy = true; renderApp();
    auth.signInWithEmailAndPassword(email, password).then(()=>{ authBusy = false; renderApp(); })
      .catch(err=>{ authBusy = false; const el=document.getElementById('auth-error'); if(el) el.textContent = err.message; renderApp(); });
  }
}

function startEsmaGame(){
  const pairs = pick(ESMA_LIST, 6);
  esmaGameData = {
    pairs,
    left: shuffle(pairs.map(p=>({id:p.id, text:p.arabic}))),
    right: shuffle(pairs.map(p=>({id:p.id, text:p.meaning}))),
    selectedLeft: null, selectedRight: null,
    matched: new Set(),
    mistakes: 0,
    finished: false,
  };
  renderApp();
}
function tryEsmaMatch(){
  const g = esmaGameData;
  if(g.selectedLeft!=null && g.selectedRight!=null){
    if(g.selectedLeft === g.selectedRight){
      g.matched.add(g.selectedLeft);
      if(g.matched.size === g.pairs.length){
        g.finished = true;
        const score = Math.max(0, g.pairs.length*10 - g.mistakes*3);
        const best = LS.get('esmaBestScore', null);
        if(best===null || score>best) LS.set('esmaBestScore', score);
        LS.set('esmaGamesPlayed', (LS.get('esmaGamesPlayed',0))+1);
      }
    } else {
      g.mistakes += 1;
    }
    g.selectedLeft = null; g.selectedRight = null;
  }
}
function selectEsmaLeft(id){ if(!esmaGameData || esmaGameData.matched.has(id)) return; esmaGameData.selectedLeft=id; tryEsmaMatch(); renderApp(); }
function selectEsmaRight(id){ if(!esmaGameData || esmaGameData.matched.has(id)) return; esmaGameData.selectedRight=id; tryEsmaMatch(); renderApp(); }
function renderEsmaGame(){
  if(!esmaGameData){
    const best = LS.get('esmaBestScore', null);
    return `
    <div class="surface rounded-2xl p-6 text-center space-y-3">
      <div class="text-3xl">🧩</div>

      ${best!==null ? `<div class="text-xs text-[color:var(--text-faint)]">En yüksek puanın: <b class="text-[color:var(--text)]">${best}</b></div>` : ''}
      <button id="esma-start-game" class="btn-accent w-full py-3 rounded-xl text-sm">Oyunu Başlat</button>
    </div>`;
  }
  const g = esmaGameData;
  if(g.finished){
    const score = Math.max(0, g.pairs.length*10 - g.mistakes*3);
    return `
    <div class="surface rounded-2xl p-6 text-center space-y-3">
      <div class="text-4xl">🎉</div>
      <div class="font-extrabold text-lg">Tamamlandı!</div>
      <div class="text-sm text-[color:var(--text-dim)]">${g.mistakes} hata · <b class="text-[color:var(--text)]">${score}</b> puan</div>
      <button id="esma-restart-game" class="btn-accent w-full py-3 rounded-xl text-sm">🔁 Yeniden Oyna</button>
    </div>`;
  }
  return `
  <div class="space-y-3">
    <div class="text-center text-xs text-[color:var(--text-dim)]">${g.matched.size}/${g.pairs.length} eşleşti · ${g.mistakes} hata</div>
    <div class="grid grid-cols-2 gap-2.5">
      <div class="space-y-2">
        ${g.left.map(it=>{
          const isMatched = g.matched.has(it.id), isSel = g.selectedLeft===it.id;
          return `<button data-esma-left="${it.id}" ${isMatched?'disabled':''} class="choice-btn ${isMatched?'is-correct':''} w-full font-ar text-lg rounded-xl px-3 py-3" dir="rtl" style="${isSel&&!isMatched?'border-color:var(--accent-dim); background:var(--accent-ink)':''}">${esc(it.text)}</button>`;
        }).join('')}
      </div>
      <div class="space-y-2">
        ${g.right.map(it=>{
          const isMatched = g.matched.has(it.id), isSel = g.selectedRight===it.id;
          return `<button data-esma-right="${it.id}" ${isMatched?'disabled':''} class="choice-btn ${isMatched?'is-correct':''} w-full text-xs rounded-xl px-3 py-3 text-left" style="${isSel&&!isMatched?'border-color:var(--accent-dim); background:var(--accent-ink)':''}">${esc(it.text)}</button>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}
function renderEsma(){

function bindEsmaEvents(){
  document.querySelectorAll('[data-esma-tab]').forEach(b=> b.onclick=()=>{ esmaTab=b.dataset.esmaTab; renderApp(); });
  const prevBtn = document.getElementById('esma-prev'); if(prevBtn) prevBtn.onclick=()=>{ esmaCardIndex=Math.max(0,esmaCardIndex-1); renderApp(); };
  const nextBtn = document.getElementById('esma-next'); if(nextBtn) nextBtn.onclick=()=>{ esmaCardIndex=Math.min(ESMA_LIST.length-1,esmaCardIndex+1); renderApp(); };
  const startBtn = document.getElementById('esma-start-game'); if(startBtn) startBtn.onclick = startEsmaGame;
  const restartBtn = document.getElementById('esma-restart-game'); if(restartBtn) restartBtn.onclick = startEsmaGame;
  document.querySelectorAll('[data-esma-left]').forEach(b=> b.onclick=()=>selectEsmaLeft(Number(b.dataset.esmaLeft)));
  document.querySelectorAll('[data-esma-right]').forEach(b=> b.onclick=()=>selectEsmaRight(Number(b.dataset.esmaRight)));
}

const KNOWLEDGE_LEVELS = [
  {xp:0,   name:'Çırak'},
  {xp:50,  name:'Talebe'},
  {xp:120, name:'Hafız Adayı'},
  {xp:220, name:'Molla'},
  {xp:350, name:'Müderris'},
  {xp:500, name:'Allâme'},
];
function getKnowledgeXP(){ return LS.get('knowledgeXP', 0); }
function addKnowledgeXP(n){ LS.set('knowledgeXP', getKnowledgeXP()+n); }
function getKnowledgeLevelInfo(){
  const xp = getKnowledgeXP();
  let idx = 0;
  for(let i=0;i<KNOWLEDGE_LEVELS.length;i++){ if(xp>=KNOWLEDGE_LEVELS[i].xp) idx=i; }
  const cur = KNOWLEDGE_LEVELS[idx], next = KNOWLEDGE_LEVELS[idx+1] || KNOWLEDGE_LEVELS[idx];
  const span = next.xp - cur.xp;
  const frac = span>0 ? Math.min(1,(xp-cur.xp)/span) : 1;
  return {xp, cur, next, frac};
}
let duelSetup = {category:'all', difficulty:'orta'};
let duelData = null;
function startDuel(category, difficulty){
  let pool = KNOWLEDGE_QUESTIONS.filter(q=> category==='all' || q.category===category);
  if(difficulty==='cokzor') pool = pool.filter(q=>q.level>=3);
  if(pool.length===0) pool = KNOWLEDGE_QUESTIONS.filter(q=> difficulty==='cokzor' ? q.level>=3 : true);
  const questions = pick(pool, Math.min(8, pool.length));
  const oppAccuracy = difficulty==='kolay' ? 0.5 : difficulty==='zor' ? 0.8 : difficulty==='cokzor' ? 0.92 : 0.65;
  duelData = {questions, idx:0, category, difficulty, oppAccuracy, userScore:0, oppScore:0, answered:false, lastChoice:null, oppLastCorrect:null, finished:false, xpGain:0};
  renderApp();
}
function submitDuelAnswer(choiceIdx){
  const d = duelData;
  if(!d || d.answered) return;
  const q = d.questions[d.idx];
  const correct = choiceIdx === q.correct;
  d.answered = true; d.lastChoice = choiceIdx;
  if(correct) d.userScore++;
  const oppCorrect = Math.random() < d.oppAccuracy;
  d.oppLastCorrect = oppCorrect;
  if(oppCorrect) d.oppScore++;
  renderApp();
}
function advanceDuel(){
  const d = duelData;
  if(d.idx < d.questions.length-1){ d.idx++; d.answered=false; d.lastChoice=null; renderApp(); }
  else {
    d.finished = true;
    const diffMultiplier = d.difficulty==='cokzor' ? 2 : d.difficulty==='zor' ? 1.5 : d.difficulty==='kolay' ? 0.75 : 1;
    d.xpGain = Math.round((d.userScore*10 + (d.userScore>d.oppScore ? 20 : 0)) * diffMultiplier);
    addKnowledgeXP(d.xpGain);
    renderApp();
  }
}

function renderDuelQuestion(){
  const d = duelData;
  const q = d.questions[d.idx];
  return `
  <section class="space-y-4">
    <div class="flex items-center justify-between text-xs">
      <span class="font-bold">⚔️ Düello · ${esc(q.category)}</span>
      <span class="text-[color:var(--text-dim)]">Soru ${d.idx+1}/${d.questions.length}</span>
    </div>
    <div class="grid grid-cols-2 gap-2.5 text-center">
      <div class="surface-2 rounded-xl p-2.5"><div class="text-[10px] text-[color:var(--text-faint)]">Sen</div><div class="text-lg font-extrabold accent-text">${d.userScore}</div></div>
      <div class="surface-2 rounded-xl p-2.5"><div class="text-[10px] text-[color:var(--text-faint)]">Rakip</div><div class="text-lg font-extrabold" style="color:var(--rose)">${d.oppScore}</div></div>
    </div>
    <div class="surface rounded-3xl p-5 space-y-3">
      <div class="text-base font-bold leading-snug">${esc(q.q)}</div>
      <div class="space-y-2">
        ${q.choices.map((c,i)=>{
          let cls = '';
          if(d.answered){ if(i===q.correct) cls='is-correct'; else if(i===d.lastChoice) cls='is-wrong'; }
          return `<button ${d.answered?'disabled':''} data-duel-choice="${i}" class="choice-btn ${cls} w-full text-left rounded-xl px-4 py-3 text-sm">${esc(c)}</button>`;
        }).join('')}
      </div>
      ${d.answered ? `
      <div class="text-center text-xs text-[color:var(--text-dim)]">Rakip bu soruyu ${d.oppLastCorrect?'doğru':'yanlış'} cevapladı.</div>
      <button id="btn-duel-next" class="btn-accent w-full py-3 rounded-xl text-sm">${d.idx<d.questions.length-1?'Sonraki Soru →':'Sonucu Gör →'}</button>
      ` : ''}
    </div>
  </section>`;
}
function renderDuelResult(){
  const d = duelData;
  const won = d.userScore>d.oppScore, tie = d.userScore===d.oppScore;
  return `
  <section class="text-center space-y-4 py-6">
    <div class="text-5xl">${won?'🏆':tie?'🤝':'📉'}</div>
    <h2 class="text-xl font-extrabold">${won?'Düelloyu Kazandın!':tie?'Berabere':'Düello Kaybedildi'}</h2>
    <div class="text-base">Sen: <b class="accent-text">${d.userScore}</b> · Rakip: <b style="color:var(--rose)">${d.oppScore}</b></div>
    <div class="text-sm text-[color:var(--text-dim)]">+${d.xpGain} XP kazandın</div>
    <div class="flex gap-2 justify-center">
      <button id="btn-duel-again" class="btn-accent px-5 py-2.5 rounded-xl text-sm">⚔️ Tekrar Düello</button>
      <button onclick="navigate('dashboard')" class="btn-ghost px-5 py-2.5 rounded-xl text-sm">Pano'ya Dön</button>
    </div>
  </section>`;
}
function renderKnowledge(){
  const lvl = getKnowledgeLevelInfo();
  if(duelData && !duelData.finished) return renderDuelQuestion();
  if(duelData && duelData.finished) return renderDuelResult();
  return renderDuelSetup(lvl);
}
function bindKnowledgeEvents(){
  document.querySelectorAll('[data-duel-cat]').forEach(b=> b.onclick=()=>{ duelSetup.category=b.dataset.duelCat; renderApp(); });
  document.querySelectorAll('[data-duel-diff]').forEach(b=> b.onclick=()=>{ duelSetup.difficulty=b.dataset.duelDiff; renderApp(); });
  const startBtn = document.getElementById('btn-start-duel'); if(startBtn) startBtn.onclick = ()=> startDuel(duelSetup.category, duelSetup.difficulty);
  document.querySelectorAll('[data-duel-choice]').forEach(b=> b.onclick=()=> submitDuelAnswer(Number(b.dataset.duelChoice)));
  const nextBtn = document.getElementById('btn-duel-next'); if(nextBtn) nextBtn.onclick = advanceDuel;
  const againBtn = document.getElementById('btn-duel-again'); if(againBtn) againBtn.onclick = ()=>{ duelData=null; renderApp(); };

let storyViewId = null;
const STORY_PUNCT = '،.؟!:؛«»"“”\'()[]';
function splitWordPunct(token){
  let start = 0, end = token.length;
  while(start < end && STORY_PUNCT.includes(token[start])) start++;
  while(end > start && STORY_PUNCT.includes(token[end-1])) end--;
  return { lead: token.slice(0,start), core: token.slice(start,end), trail: token.slice(end) };
}
function renderStoryText(story){
  const tokens = story.text.split(/\s+/).filter(Boolean);
  return tokens.map(tok=>{
    const {lead, core, trail} = splitWordPunct(tok);
    if(!core) return esc(tok);
    const meaning = story.glossary[core];
    if(meaning){
      return esc(lead) + `<span class="glossary-word"><span class="glossary-tooltip">${esc(meaning)}</span><span class="glossary-label">${esc(core)}</span></span>` + esc(trail);
    }
    return esc(tok);
  }).join(' ');
}
function renderStoryDetail(story){
  return `
  <section class="space-y-4">
    <button onclick="closeStory()" class="text-xs text-[color:var(--text-dim)]">‹ Hikâyelere Dön</button>
    <div>
      <div class="text-2xl">${story.icon}</div>
      <h2 class="font-extrabold text-lg mt-1">${esc(story.title)}</h2>
      <p class="text-[11px] text-[color:var(--text-faint)] mt-0.5">${esc(story.theme)}</p>
    </div>
    <div class="surface rounded-2xl p-5 font-ar text-lg" dir="rtl" style="line-height:2.35">${renderStoryText(story)}</div>
    <div class="text-[11px] text-[color:var(--text-faint)] text-center">Herhangi bir kelimeye dokunarak Türkçe anlamını görebilirsin.</div>
    <button onclick="startStoryQuiz('${story.id}')" class="w-full btn-accent rounded-2xl py-3.5 font-bold text-sm">✅ Okudum, Sınava Gir (10 Soru)</button>
  </section>`;
}
function renderStories(){
  if(storyViewId){
    const story = STORIES.find(s=>s.id===storyViewId);

function closeStory(){ storyViewId=null; renderApp(); }
function bindStoriesEvents(){
  document.querySelectorAll('[data-open-story]').forEach(b=> b.onclick=()=>{ storyViewId=b.dataset.openStory; renderApp(); });
  document.querySelectorAll('.glossary-word').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const tip = el.querySelector('.glossary-tooltip');
      const wasOpen = tip.classList.contains('show');
      document.querySelectorAll('.glossary-tooltip.show').forEach(t=>t.classList.remove('show'));
      if(!wasOpen) tip.classList.add('show');
    };
  });
}

let storyQuizData = null;
function shuffleChoicesKeepCorrect(choices, correctIdx){
  const items = choices.map((c,i)=>({c, isCorrect: i===correctIdx}));
  const shuffled = shuffle(items);
  return { choices: shuffled.map(x=>x.c), correct: shuffled.findIndex(x=>x.isCorrect) };
}
function buildStoryQuizQuestions(story){
  const comprehensionQs = story.comprehension.map(c=>{
    const {choices, correct} = shuffleChoicesKeepCorrect(c.choices, c.correct);
    return { type:'comprehension', question: c.q, choices, correct };
  });
  const vocabPicks = pick(story.quizWords, 4);
  const vocabQs = vocabPicks.map(([word, meaning])=>{
    const distractorPool = story.quizWords.filter(([w])=> w!==word).map(([,m])=>m);
    const distractors = pick(distractorPool, 3);
    const rawChoices = shuffle([meaning, ...distractors]);
    const correct = rawChoices.indexOf(meaning);
    return { type:'vocab', question: `Hikâyede geçen "${word}" kelimesinin anlamı nedir?`, choices: rawChoices, correct, word };
  });
  return shuffle([...comprehensionQs, ...vocabQs]);
}
function startStoryQuiz(storyId){
  const story = STORIES.find(s=>s.id===storyId);
  if(!story) return;
  storyQuizData = {
    storyId, storyTitle: story.title,
    questions: buildStoryQuizQuestions(story),
    idx: 0, correctCount: 0, selected: null, answered: false, finished: false,
  };
  navigate('storyquiz');
}
function selectStoryQuizChoice(i){
  const sq = storyQuizData;
  if(!sq || sq.answered) return;
  sq.selected = i;
  sq.answered = true;
  const q = sq.questions[sq.idx];
  if(i === q.correct) sq.correctCount += 1;
  renderApp();
}
function nextStoryQuizQuestion(){
  const sq = storyQuizData;
  if(!sq) return;
  if(sq.idx >= sq.questions.length-1){ sq.finished = true; renderApp(); return; }
  sq.idx += 1; sq.selected = null; sq.answered = false;
  renderApp();
}
function retryStoryQuiz(){
  if(!storyQuizData) return;
  startStoryQuiz(storyQuizData.storyId);
}
function backToStoryFromQuiz(){
  storyViewId = storyQuizData ? storyQuizData.storyId : null;
  storyQuizData = null;
  navigate('stories');
}
function renderStoryQuiz(){
  const sq = storyQuizData;
  if(!sq) return emptyState('Aktif bir hikâye sınavı yok', 'Bir hikâyeyi okuyup "Okudum, Sınava Gir" butonuna dokun.', 'stories');

    const pct = Math.round((sq.correctCount / sq.questions.length) * 100);
    const passed = sq.correctCount >= 7;
    return `

        <div class="text-sm mt-3 text-[color:var(--text-dim)]">${passed ? 'Harika! Hikâyeyi çok iyi anlamışsın.' : 'Fena değil, hikâyeyi bir daha okuyup tekrar deneyebilirsin.'}</div>
      </div>
      <div class="flex gap-2">

      </div>
    </section>`;
  }
  const q = sq.questions[sq.idx];
  return `

/* ============================= SINAV MOTORU ============================= */
function beginQuizSession(words, opts){
  sessionData = {
    mode: opts.mode,
    originalWords: words,
    queue: shuffle(words),
    retryQueue: [],
    round: 1,
    total: words.length,
    correctFirstTry: 0,
    attempted: new Set(),
    mastered: new Set(),
    finished: false,
    checkpointRange: opts.checkpointRange || null,
    current: null,
    currentDirection: null,
    currentChoices: null,
    awaitingNext: false,
  };
  advanceQuestion();
}
function advanceQuestion(){
  const sd = sessionData;
  if(sd.queue.length===0){
    if(sd.retryQueue.length>0){ sd.queue = shuffle(sd.retryQueue); sd.retryQueue=[]; sd.round+=1; }
    else { finishQuizSession(); return; }
  }
  sd.current = sd.queue.shift();
  sd.currentDirection = Math.random()<0.5 ? 'tr2ar' : 'ar2tr';
  sd.currentChoices = sd.currentDirection==='tr2ar' ? buildChoices(sd.current) : null;
  sd.awaitingNext = false;
  renderApp();
  setTimeout(()=>{ const el=document.getElementById('answer-input'); if(el) el.focus(); }, 30);
}
function recordAnswer(word, direction, correct){
  const sd = sessionData;
  const stats = state().stats;
  LS.set('stats', {answered: stats.answered+1, correct: stats.correct+(correct?1:0)});
  const isFirstAttempt = !sd.attempted.has(word.id);
  if(isFirstAttempt){
    sd.attempted.add(word.id);
    if(correct) sd.correctFirstTry += 1;
    updateSrsForAnswer(word.id, correct); // zaten ezberlenmiş bir kelimeyse tekrar tarihini güncelle
  }
  if(correct){
    sd.mastered.add(word.id);
  } else {
    if(!sd.retryQueue.find(w=>w.id===word.id)) sd.retryQueue.push(word);
    if(sd.mode!=='hard'){
      const hard = state().hard;
      LS.set('hard', {...hard, [word.id]: (hard[word.id]||0)+1});
    }
  }
}
function submitCurrentAnswer(explicitVal){
  const sd = sessionData;
  if(!sd || sd.awaitingNext) return;
  const input = document.getElementById('answer-input');
  const val = explicitVal !== undefined ? explicitVal : (input ? input.value : '');
  const word = sd.current;
  const correct = checkAnswer(word, sd.currentDirection, val);
  recordAnswer(word, sd.currentDirection, correct);
  sd.lastResult = {correct, word, direction: sd.currentDirection, userAnswer: val};
  sd.awaitingNext = true;
  renderApp();
}
function selectChoice(arabicText){ submitCurrentAnswer(arabicText); }

function finishQuizSession(){
  const sd = sessionData;
  sd.finished = true;
  updateStreak();
  if(sd.mode==='normal'){
    const s = state();
    const ids = sd.originalWords.map(w=>w.id);
    const newlyMemorized = ids.filter(id=>!s.memorized.includes(id));
    LS.set('toLearn', s.toLearn.filter(id=>!ids.includes(id)));
    LS.set('memorized', [...s.memorized, ...newlyMemorized]);
    newlyMemorized.forEach(id=> ensureSrsEntry(id));
    logDailyProgress(newlyMemorized.length);
    checkBadges();
    maybeTriggerCheckpoint();
  } else if(sd.mode==='hard'){
    const hard = {...state().hard};
    sd.originalWords.forEach(w=> delete hard[w.id]);
    LS.set('hard', hard);
  } else if(sd.mode==='checkpoint'){
    const score = sd.correctFirstTry / sd.total;
    sd.checkpointScore = score;
    sd.checkpointPassed = score >= CHECKPOINT_PASS_RATIO;
    if(sd.checkpointPassed){
      const cp = state().checkpoint;
      LS.set('checkpoint', {passedThrough: cp.passedThrough + CHECKPOINT_INTERVAL, pending:false});
      checkBadges();
    }
  }
  renderNav(); renderApp();
}
function startCheckpoint(){
  const s = state();
  const start = s.checkpoint.passedThrough;
  const ids = s.memorized.slice(start, start+CHECKPOINT_INTERVAL);
  const words = ids.map(id=>WORDS_BY_ID[id]);
  beginQuizSession(words, {mode:'checkpoint', checkpointRange:[start+1, start+CHECKPOINT_INTERVAL]});
  navigate('quiz');
}
function startHardWordsQuiz(){
  const s = state();
  const ids = Object.keys(s.hard).map(Number);
  if(ids.length===0){ toast('Zor kelimeler kutusu boş 🎉'); return; }

  beginQuizSession(due.slice(0,20), {mode:'srs'});

/* ============================= RENDER: SÖZLÜK (bulanık arama) ============================= */
let dictQuery = '';
function scoreDictMatch(word, qNormAr, qNormTr){
  const wordAr = normalizeArabic(word.arabic);
  const wordTrParts = normalizeTr(word.turkish).split('/').map(s=>s.trim()).filter(Boolean);
  const wordTranslit = normalizeTr(word.transliteration||'');
  if(qNormAr && wordAr.includes(qNormAr)) return 0;
  if(qNormTr && wordTrParts.some(p=>p.includes(qNormTr))) return 0;
  if(qNormTr && wordTranslit && wordTranslit.includes(qNormTr)) return 1;
  let best = Infinity;
  if(qNormAr && wordAr) best = Math.min(best, levenshtein(qNormAr, wordAr));
  if(qNormTr){
    wordTrParts.forEach(p=> p && (best = Math.min(best, levenshtein(qNormTr, p))));
    if(wordTranslit) best = Math.min(best, levenshtein(qNormTr, wordTranslit));
  }
  return best===Infinity ? 999 : 2+best;
}
function searchDictionary(query){
  const q = (query||'').trim();
  if(!q) return [];
  const qNormAr = normalizeArabic(q);
  const qNormTr = normalizeTr(q);
  const maxFuzzy = Math.max(2, Math.floor(Math.max(qNormAr.length, qNormTr.length)*0.45));
  const scored = ARABIC_WORDS.map(w=>({w, score: scoreDictMatch(w, qNormAr, qNormTr)}))
    .filter(x=> x.score<=1 || (x.score-2)<=maxFuzzy);
  scored.sort((a,b)=> a.score-b.score || a.w.arabic.length-b.w.arabic.length);
  return scored.slice(0,30).map(x=>x.w);
}
