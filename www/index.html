        </div>`).join('')}
    </div>
    <button onclick="startHardWordsQuiz()" class="btn-accent w-full px-5 py-3 rounded-2xl text-sm">Mini Testi Başlat</button>
    `}
  </section>`;
}

/* ============================= RENDER: AKILLI TEKRAR ============================= */
function renderSrs(){
  const s = state();
  const due = getDueSrsWords();
  const upcoming = getUpcomingSrsCounts();
  const trackedCount = Object.keys(s.srs).length;
  return `
  <section class="space-y-4">
    <div><h2 class="font-extrabold text-lg">Akıllı Tekrar</h2><p class="text-xs text-[color:var(--text-dim)] mt-0.5">Unutma eğrisine göre zamanlanmış tekrar</p></div>

    <div class="rounded-[1.75rem] p-5 text-center" style="background:linear-gradient(150deg, var(--accent-ink), var(--hero-grad-2))">
      <div class="text-[11px] font-semibold text-[color:var(--text-dim)] uppercase tracking-wide">Şu An Tekrar Zamanı Gelen</div>
      <div class="text-4xl font-extrabold accent-text mt-1">${due.length}</div>
      <div class="text-xs text-[color:var(--text-dim)] mt-1">kelime</div>
    </div>

    <div class="grid grid-cols-3 gap-2.5">
      <div class="surface-2 rounded-2xl p-3 text-center"><div class="text-lg font-extrabold">${upcoming.dueToday}</div><div class="text-[10px] text-[color:var(--text-faint)] mt-1">Bugün</div></div>
      <div class="surface-2 rounded-2xl p-3 text-center"><div class="text-lg font-extrabold">${upcoming.dueTomorrow}</div><div class="text-[10px] text-[color:var(--text-faint)] mt-1">Yarın</div></div>
      <div class="surface-2 rounded-2xl p-3 text-center"><div class="text-lg font-extrabold">${upcoming.dueThisWeek}</div><div class="text-[10px] text-[color:var(--text-faint)] mt-1">Bu Hafta</div></div>
    </div>

    ${due.length>0 ? `
    <button id="btn-start-srs" class="btn-accent w-full px-6 py-3.5 rounded-2xl text-sm">🔁 Akıllı Tekrarı Başlat (${Math.min(due.length,20)} kelime)</button>
    ` : `<div class="surface rounded-2xl p-6 text-center text-sm text-[color:var(--text-faint)]">Şu an tekrar edilecek kelime yok. Yeni kelimeler ezberledikçe burada birikecekler 🌱</div>`}

    <div class="text-[11px] text-[color:var(--text-faint)] leading-relaxed">
      Bir kelimeyi ezberlediğinde otomatik olarak akıllı tekrar takibine alınır. Doğru cevapladıkça tekrar aralığı gitgide açılır (unutma eğrisine göre), yanlış cevapladığında sıfırlanıp yakın zamanda tekrar karşına çıkar. Şu an takip edilen: <b class="text-[color:var(--text-dim)]">${trackedCount}</b> kelime.
    </div>
  </section>`;
}
function bindSrsEvents(){
  const btn = document.getElementById('btn-start-srs');
  if(btn) btn.onclick = startSrsReview;
}

/* ============================= RENDER: GİRİŞ EKRANI ============================= */
function renderWelcome(){
  return `
  <div style="position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:0 24px; background:var(--bg);">
    <section style="width:100%; max-width:320px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px;">
      <svg width="80" height="80" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" class="fade-up" style="filter:drop-shadow(0 18px 32px rgba(124,58,237,.35))">
        <defs><linearGradient id="logoGradLg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6366F1"/><stop offset="55%" stop-color="#A855F7"/><stop offset="100%" stop-color="#EC4899"/>
        </linearGradient></defs>
        <path d="M24 3 L42 17 L24 45 L6 17 Z" fill="url(#logoGradLg)"/>
        <path d="M24 3 L42 17 L24 21 Z" fill="#ffffff" opacity="0.28"/>
        <path d="M6 17 L24 21 L24 45 Z" fill="#000000" opacity="0.10"/>
      </svg>
      <div class="fade-up" style="animation-delay:.05s">
        <h1 class="font-ar text-4xl font-extrabold" dir="rtl">كنوز</h1>
        <p class="text-sm text-[color:var(--text-dim)] mt-1.5">Künûz · Arapça Kelime Hazinesi</p>
      </div>

      ${!welcomeGreeted ? `
        <button id="btn-greet" class="btn-accent px-8 py-4 rounded-2xl text-base fade-up" style="animation-delay:.12s">🤲 Selamünaleyküm</button>
      ` : `
        <div class="fade-up rounded-[2rem] px-7 py-6 w-full" style="background:var(--accent-ink); box-shadow:0 16px 36px -18px rgba(124,58,237,.35)">
          <div class="font-ar text-2xl mb-2 leading-relaxed" dir="rtl">وَعَلَيْكُم السَّلَام وَرَحْمَةُ اللهِ وَبَرَكَاتُه</div>
          <div class="font-bold text-sm accent-text">Aleyküm selam ve Rahmetullahi ve Berakatuh</div>
        </div>
        <button id="btn-continue" class="btn-accent px-8 py-3.5 rounded-2xl text-sm fade-up">Panoya Geç →</button>
      `}
    </section>
  </div>`;
}
function bindWelcomeEvents(){
  const greetBtn = document.getElementById('btn-greet');
  if(greetBtn) greetBtn.onclick = ()=>{
    welcomeGreeted = true;
    renderApp();
    setTimeout(()=>{ if(currentView==='welcome') navigate('dashboard'); }, 2600);
  };
  const contBtn = document.getElementById('btn-continue');
  if(contBtn) contBtn.onclick = ()=> navigate('dashboard');
}

/* ============================= ORTAK ============================= */
function emptyState(title, sub, backTo){
  return `<div class="surface rounded-2xl p-8 text-center space-y-3">
    <div class="text-3xl">📭</div>
    <div class="font-bold">${esc(title)}</div>
    <div class="text-sm text-[color:var(--text-dim)]">${esc(sub)}</div>
    <button onclick="navigate('${backTo}')" class="btn-accent px-4 py-2 rounded-xl text-sm">Devam Et</button>
  </div>`;
}
function renderApp(){
  const app = document.getElementById('app');
  const header = document.getElementById('app-header');
  if(header) header.style.display = currentView==='welcome' ? 'none' : '';
  let html='';
  if(currentView==='welcome') html = renderWelcome();
  else if(currentView==='dashboard') html = renderDashboard();
  else if(currentView==='filters') html = renderFilters();
  else if(currentView==='flashcards') html = renderFlashcards();
  else if(currentView==='quiz') html = renderQuiz();
  else if(currentView==='hardwords') html = renderHardWords();
  else if(currentView==='srs') html = renderSrs();
  else if(currentView==='badges') html = renderBadges();
  else if(currentView==='ibadah') html = renderIbadah();
  else if(currentView==='tasbih') html = renderTasbih();
  else if(currentView==='prayertimes') html = renderPrayerTimes();
  else if(currentView==='qibla') html = renderQibla();
  else if(currentView==='dailycard') html = renderDailyCardView();
  else if(currentView==='esma') html = renderEsma();
  else if(currentView==='knowledge') html = renderKnowledge();
  else if(currentView==='stories') html = renderStories();
  else if(currentView==='storyquiz') html = renderStoryQuiz();
  else if(currentView==='addword') html = renderAddWord();
  else if(currentView==='dictionary') html = renderDictionary();
  else if(currentView==='account') html = renderAccountView();
  else if(currentView==='settings') html = renderSettings();
  app.innerHTML = html;
  app.classList.remove('view-transition');
  void app.offsetWidth;
  app.classList.add('view-transition');
  if(currentView==='welcome') bindWelcomeEvents();
  if(currentView==='dashboard') bindDashboardEvents();
  if(currentView==='filters') bindFilterEvents();
  if(currentView==='ibadah') bindIbadahEvents();
  if(currentView==='tasbih') bindTasbihEvents();
  if(currentView==='prayertimes') bindPrayerTimesEvents();
  if(currentView==='qibla') bindQiblaEvents();
  if(currentView==='dailycard') bindDailyCardEvents();
  if(currentView==='esma') bindEsmaEvents();
  if(currentView==='knowledge') bindKnowledgeEvents();
  if(currentView==='stories') bindStoriesEvents();
  if(currentView==='storyquiz') bindStoryQuizEvents();
  if(currentView==='srs') bindSrsEvents();
  if(currentView==='addword') bindAddWordEvents();
  if(currentView==='dictionary') bindDictionaryEvents();
  if(currentView==='account') bindAccountEvents();
  if(currentView==='settings') bindSettingsEvents();
  if(currentView==='flashcards') bindFlashcardEvents();
  if(currentView==='quiz'){
    const input = document.getElementById('answer-input');
    if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') submitCurrentAnswer(); });
    document.querySelectorAll('[data-choice]').forEach(btn=>{
      btn.onclick = ()=> selectChoice(btn.dataset.choice);
    });
  }
}
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && sessionData && sessionData.awaitingNext && currentView==='quiz'){ advanceQuestion(); }
});

/* ============================= BAŞLAT ============================= */
renderNav();
renderApp();
</script>
</body>
</html>
