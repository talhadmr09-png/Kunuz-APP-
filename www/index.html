<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كنوز — Künûz · Arapça Kelime Hazinesi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-2:#F7F7FB; --surface:#FFFFFF; --surface-2:#F4F4F9; --surface-3:#ECECF5;
    --border:#E4E4EE; --border-soft:#ECECF4;
    --accent:#7C3AED; --accent-2:#DB2777; --accent-soft:#7C3AED; --accent-dim:#C4B5FD; --accent-ink:#F1EBFF;
    --grad-accent: linear-gradient(135deg, #6366F1 0%, #A855F7 50%, #EC4899 100%);
    --text:#16161F; --text-dim:#5B5C6B; --text-faint:#9496A5;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#E11D48; --rose-soft:#FDEFF2; --rose-line:#F3AABB;
    --blue:#0284C7; --amber:#D97706; --amber-soft:#FEF3DC; --teal:#0D9488;
    --header-bg: rgba(255,255,255,0.85); --menu-bg:#FFFFFF; --hero-grad-2:#FBEFFF;
  }
  /* --- Gece Modu --- */
  [data-theme="dark"]{
    --bg:#0B0B14; --bg-2:#111119; --surface:#15151F; --surface-2:#1B1B26; --surface-3:#23232F;
    --border:#2B2B39; --border-soft:#232330;
    --accent:#A78BFA; --accent-2:#F472B6; --accent-soft:#A78BFA; --accent-dim:#6D28D9; --accent-ink:#241C3D;
    --grad-accent: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
    --text:#F1F1F6; --text-dim:#A8A8B8; --text-faint:#6E6E80;
    --green:#34D399; --green-soft:#0F2A20; --green-line:#1F6B4C;
    --rose:#FB7185; --rose-soft:#341019; --rose-line:#7A2436;
    --blue:#38BDF8; --amber:#FBBF24; --amber-soft:#332409; --teal:#2DD4BF;
    --header-bg: rgba(11,11,20,0.85); --menu-bg:#15151F; --hero-grad-2:#241C3D;
  }
  /* --- Kültürel Tema (İznik çinisi ilhamlı: lacivert-turkuaz-hardal) --- */
  [data-theme="cultural"]{
    --bg:#FBF8F1; --bg-2:#F3ECDD; --surface:#FFFFFF; --surface-2:#F4EFE0; --surface-3:#ECE1C4;
    --border:#E3D6AE; --border-soft:#ECE1C4;
    --accent:#0F6E6E; --accent-2:#B8860B; --accent-soft:#0F6E6E; --accent-dim:#8FC7C4; --accent-ink:#E7F3F1;
    --grad-accent: linear-gradient(135deg, #0B5D6B 0%, #14827E 50%, #C79A2A 100%);
    --text:#1E2A2A; --text-dim:#5B6660; --text-faint:#93998F;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#B23A48; --rose-soft:#FBEDEA; --rose-line:#E3AFAF;
    --blue:#0B6E8F; --amber:#B8860B; --amber-soft:#FBF0D9; --teal:#0D9488;
    --header-bg: rgba(251,248,241,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#F3ECDD;
  }
  /* --- Zümrüt Tema (orman yeşili + altın) --- */
  [data-theme="emerald"]{
    --bg:#F4FAF6; --bg-2:#E8F5EC; --surface:#FFFFFF; --surface-2:#EAF6EE; --surface-3:#DCEFE2;
    --border:#CFE8D8; --border-soft:#DCEFE2;
    --accent:#0F7A4D; --accent-2:#B8860B; --accent-soft:#0F7A4D; --accent-dim:#8FD1AE; --accent-ink:#E3F5EA;
    --grad-accent: linear-gradient(135deg, #0B6B41 0%, #159A5B 50%, #D4AF37 100%);
    --text:#12261C; --text-dim:#4E6857; --text-faint:#8CA79A;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#C23B4B; --rose-soft:#FBEDEA; --rose-line:#E3AFAF;
    --blue:#0B6E8F; --amber:#B8860B; --amber-soft:#FBF0D9; --teal:#0D9488;
    --header-bg: rgba(244,250,246,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#E8F5EC;
  }
  /* --- Okyanus Tema (derin mavi-turkuaz) --- */
  [data-theme="ocean"]{
    --bg:#F2F8FC; --bg-2:#E4F0FA; --surface:#FFFFFF; --surface-2:#E9F2FA; --surface-3:#D9EAF6;
    --border:#C9E0F2; --border-soft:#D9EAF6;
    --accent:#0369A1; --accent-2:#0891B2; --accent-soft:#0369A1; --accent-dim:#93C5DE; --accent-ink:#E3F0FA;
    --grad-accent: linear-gradient(135deg, #075985 0%, #0EA5C4 50%, #22D3EE 100%);
    --text:#0B1F2E; --text-dim:#4C6579; --text-faint:#88A0B2;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#DC3B5D; --rose-soft:#FCEBEF; --rose-line:#F0AEC0;
    --blue:#0284C7; --amber:#CA8A04; --amber-soft:#FDF0D4; --teal:#0D9488;
    --header-bg: rgba(242,248,252,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#E4F0FA;
  }
  /* --- Sepya Tema (sıcak kahve/krem, göz dostu okuma) --- */
  [data-theme="sepia"]{
    --bg:#F5EEDC; --bg-2:#EFE4CB; --surface:#FBF4E4; --surface-2:#F0E5CB; --surface-3:#E6D8B7;
    --border:#DBC79E; --border-soft:#E6D8B7;
    --accent:#8B5A2B; --accent-2:#A6762F; --accent-soft:#8B5A2B; --accent-dim:#D2AC7D; --accent-ink:#EDE0C5;
    --grad-accent: linear-gradient(135deg, #6E4423 0%, #96652F 50%, #C79A4E 100%);
    --text:#2E2311; --text-dim:#6B5A3B; --text-faint:#A08F6C;
    --green:#4B7A3E; --green-soft:#E8F0DE; --green-line:#B7D19E;
    --rose:#A2413A; --rose-soft:#F3E3DD; --rose-line:#D9A79E;
    --blue:#436B87; --amber:#A6762F; --amber-soft:#F1DFB8; --teal:#5C8A7A;
    --header-bg: rgba(245,238,220,0.88); --menu-bg:#FBF4E4; --hero-grad-2:#EFE4CB;
  }
  /* --- Kehribar Tema (çöl kumu, terracotta, altın) --- */
  [data-theme="amber"]{
    --bg:#FDF6ED; --bg-2:#F7EAD5; --surface:#FFFFFF; --surface-2:#F9EFDD; --surface-3:#F0DFBE;
    --border:#E8CFA0; --border-soft:#F0DFBE;
    --accent:#B45309; --accent-2:#9A3412; --accent-soft:#B45309; --accent-dim:#E3B77A; --accent-ink:#F7E6CC;
    --grad-accent: linear-gradient(135deg, #92400E 0%, #C2680C 50%, #EAB308 100%);
    --text:#2B1C0C; --text-dim:#6B5539; --text-faint:#A28D6E;
    --green:#4D7C0F; --green-soft:#EEF5DC; --green-line:#BBD98A;
    --rose:#B91C1C; --rose-soft:#FBE5E1; --rose-line:#E6A79F;
    --blue:#0E7490; --amber:#B45309; --amber-soft:#FBEAC7; --teal:#0F766E;
    --header-bg: rgba(253,246,237,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#F7EAD5;
  }
  /* --- Lavanta Tema (yumuşak mor, sakin gece okuması) --- */
  [data-theme="lavender"]{
    --bg:#F7F5FC; --bg-2:#EEEAF8; --surface:#FFFFFF; --surface-2:#F1EDFA; --surface-3:#E3DBF3;
    --border:#D9CCF0; --border-soft:#E3DBF3;
    --accent:#6D28D9; --accent-2:#A21CAF; --accent-soft:#6D28D9; --accent-dim:#C4B0EC; --accent-ink:#EEE6FB;
    --grad-accent: linear-gradient(135deg, #5B21B6 0%, #8B5CF6 50%, #D946EF 100%);
    --text:#241B3A; --text-dim:#5C527A; --text-faint:#9489B0;
    --green:#0F9D63; --green-soft:#E9FBF2; --green-line:#8DE0B8;
    --rose:#DB2777; --rose-soft:#FCE8F1; --rose-line:#F1AFD1;
    --blue:#4338CA; --amber:#B45309; --amber-soft:#FBEAC7; --teal:#0D9488;
    --header-bg: rgba(247,245,252,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#EEEAF8;
  }
  /* --- Gece Mavisi Tema (derin lacivert + neon camgöbeği) --- */
  [data-theme="midnight"]{
    --bg:#0A0E1A; --bg-2:#0F1524; --surface:#131A2B; --surface-2:#1A2338; --surface-3:#212B45;
    --border:#2A3552; --border-soft:#212B45;
    --accent:#38BDF8; --accent-2:#818CF8; --accent-soft:#38BDF8; --accent-dim:#1E5A8A; --accent-ink:#16233D;
    --grad-accent: linear-gradient(135deg, #1E40AF 0%, #0EA5E9 50%, #67E8F9 100%);
    --text:#E8EDFB; --text-dim:#9AACC9; --text-faint:#5D6E8F;
    --green:#34D399; --green-soft:#0F2A20; --green-line:#1F6B4C;
    --rose:#F87171; --rose-soft:#341A19; --rose-line:#7A3436;
    --blue:#38BDF8; --amber:#FBBF24; --amber-soft:#332409; --teal:#2DD4BF;
    --header-bg: rgba(10,14,26,0.85); --menu-bg:#131A2B; --hero-grad-2:#16233D;
  }
  /* --- Gül Bahçesi Tema (pudra pembe + adaçayı yeşili) --- */
  [data-theme="rosegarden"]{
    --bg:#FFF5F7; --bg-2:#FCE9EE; --surface:#FFFFFF; --surface-2:#FDEEF1; --surface-3:#FBDFE6;
    --border:#F5C8D3; --border-soft:#FBDFE6;
    --accent:#BE185D; --accent-2:#059669; --accent-soft:#BE185D; --accent-dim:#F0A8C4; --accent-ink:#FCE7EF;
    --grad-accent: linear-gradient(135deg, #9D174D 0%, #DB2777 50%, #F472B6 100%);
    --text:#3B1220; --text-dim:#7A4A58; --text-faint:#B48993;
    --green:#059669; --green-soft:#E7F7F0; --green-line:#A7E4CB;
    --rose:#BE185D; --rose-soft:#FCE7EF; --rose-line:#F0A8C4;
    --blue:#0369A1; --amber:#B45309; --amber-soft:#FBEAC7; --teal:#0D9488;
    --header-bg: rgba(255,245,247,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#FCE9EE;
  }
  /* --- Volkanik Tema (kömür karası + ateş turuncusu) --- */
  [data-theme="volcanic"]{
    --bg:#0C0A09; --bg-2:#1C1210; --surface:#211714; --surface-2:#2B1D19; --surface-3:#3A2621;
    --border:#4A2F27; --border-soft:#3A2621;
    --accent:#F97316; --accent-2:#DC2626; --accent-soft:#F97316; --accent-dim:#9A3412; --accent-ink:#2B1608;
    --grad-accent: linear-gradient(135deg, #7C2D12 0%, #EA580C 50%, #FACC15 100%);
    --text:#FDF1EA; --text-dim:#C9A594; --text-faint:#8A6A5C;
    --green:#65A30D; --green-soft:#1A2410; --green-line:#3F5A1F;
    --rose:#EF4444; --rose-soft:#2B1210; --rose-line:#6B2A26;
    --blue:#0EA5C4; --amber:#FACC15; --amber-soft:#2B2308; --teal:#0D9488;
    --header-bg: rgba(12,10,9,0.85); --menu-bg:#211714; --hero-grad-2:#2B1608;
  }
  /* --- Nane Ferahlığı Tema (taze nane yeşili + mercan) --- */
  [data-theme="mint"]{
    --bg:#F0FBF8; --bg-2:#E0F5EF; --surface:#FFFFFF; --surface-2:#E9F8F3; --surface-3:#D6F0E6;
    --border:#BFE8DA; --border-soft:#D6F0E6;
    --accent:#0D9488; --accent-2:#F97316; --accent-soft:#0D9488; --accent-dim:#7DD3C6; --accent-ink:#DFF7F1;
    --grad-accent: linear-gradient(135deg, #0F766E 0%, #14B8A6 50%, #5EEAD4 100%);
    --text:#0A2E28; --text-dim:#4C7A70; --text-faint:#8DB3A9;
    --green:#0D9488; --green-soft:#DFF7F1; --green-line:#7DD3C6;
    --rose:#F43F5E; --rose-soft:#FDE7EB; --rose-line:#F4A8B5;
    --blue:#0284C7; --amber:#EA580C; --amber-soft:#FDE9DA; --teal:#14B8A6;
    --header-bg: rgba(240,251,248,0.88); --menu-bg:#FFFFFF; --hero-grad-2:#E0F5EF;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body, .surface, .surface-2, .surface-3, header, .menu-dropdown, .choice-btn, .seg-btn, .chip-btn, .btn-ghost{
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }
  body{background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; letter-spacing:-.01em;}
  body{
    background-image:
      radial-gradient(circle at 12% -8%, rgba(124,58,237,0.08), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(219,39,119,0.06), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(13,148,136,0.05), transparent 45%);
    background-attachment:fixed;
  }
  .font-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-weight:500; line-height:1.7;}
  .hairline{border-color:var(--border);}
  .surface{background:var(--surface); border:1px solid var(--border); box-shadow:0 1px 2px rgba(20,20,40,.04);}
  .surface-2{background:var(--surface-2); border:1px solid var(--border-soft);}
  .surface-3{background:var(--surface-3); border:1px solid var(--border-soft);}
  ::selection{background:var(--accent); color:#fff;}
  .scrollbar-thin::-webkit-scrollbar{height:6px; width:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
  input:focus, button:focus{outline:2px solid var(--accent); outline-offset:2px;}
  .accent-text{background:var(--grad-accent); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .btn-accent{background:var(--grad-accent); color:#fff; font-weight:800; box-shadow:0 10px 24px -10px rgba(124,58,237,.55);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-accent:disabled{opacity:.32; cursor:not-allowed; filter:none; box-shadow:none;}
  .btn-ghost{background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text); font-weight:600;}
  .btn-ghost:hover{border-color:var(--border);}
  .tag{border:1px solid var(--border); background:var(--surface-2); font-size:.7rem; padding:.15rem .55rem; border-radius:999px; color:var(--text-dim);}

  .menu-trigger{background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text); width:38px; height:38px;}
  .menu-trigger:hover{border-color:var(--accent-dim); background:var(--surface-3);}
  .menu-dropdown{background:var(--menu-bg); border:1px solid var(--border); box-shadow:0 24px 48px -14px rgba(20,20,40,.22);}
  .menu-item{color:var(--text-dim); transition:background .12s ease, color .12s ease;}
  .menu-item:hover{background:var(--surface-2); color:var(--text);}
  .menu-item.active{color:var(--accent); background:var(--accent-ink);}

  .seg-btn{border:1px solid var(--border-soft); color:var(--text-dim); background:var(--surface-2); transition:all .15s ease; font-weight:700;}
  .seg-btn.active{border-color:transparent; color:#fff; background:var(--grad-accent);}
  .seg-btn:hover:not(.active){color:var(--text); border-color:var(--border);}

  .chip-btn{border:1px solid var(--border-soft); color:var(--text-dim); background:var(--surface-2); transition:all .15s ease;}
  .chip-btn.active{border-color:var(--accent-dim); color:var(--accent); background:var(--accent-ink);}
  .chip-btn:hover:not(.active){color:var(--text);}

  .choice-btn{border:1.5px solid var(--border-soft); background:var(--surface-2); transition:all .12s ease; text-align:left; color:var(--text);}
  .choice-btn:hover:not(:disabled){border-color:var(--accent-dim); background:var(--surface-3);}
  .choice-btn:disabled{cursor:default;}
  .choice-btn.is-correct{border-color:var(--green-line); background:var(--green-soft); color:var(--green);}
  .choice-btn.is-wrong{border-color:var(--rose-line); background:var(--rose-soft); color:var(--rose);}
  .glossary-word{position:relative; color:var(--accent); font-weight:700; cursor:pointer; border-bottom:1.5px dotted var(--accent-dim);}
  .glossary-tooltip{
    position:absolute; bottom:125%; left:50%; transform:translateX(-50%) translateY(4px);
    background:var(--text); color:var(--bg); font-size:11px; font-weight:500; line-height:1.4;
    padding:7px 11px; border-radius:9px; white-space:normal; width:max-content; max-width:190px;
    opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease; z-index:30; text-align:center;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.35);
  }
  .glossary-tooltip.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }

  @keyframes flashGreen{0%{background-color:rgba(15,157,99,.10)}100%{background-color:transparent}}
  @keyframes flashRose{0%{background-color:rgba(225,29,72,.10)}100%{background-color:transparent}}
  .flash-correct{animation:flashGreen .8s ease-out;}
  .flash-wrong{animation:flashRose .8s ease-out;}
  .card-enter{animation:cardIn .3s ease both;}
  @keyframes cardIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
  .progress-track{background:var(--surface-2); border:1px solid var(--border-soft);}
  .progress-fill{background:var(--grad-accent);}
  .badge-circle{width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; background:var(--surface-2); border:1px solid var(--border-soft);}
  .hero-card{position:relative; overflow:hidden;}
  .hero-card::before{content:""; position:absolute; inset:0; background:
     radial-gradient(circle at 20% 10%, rgba(124,58,237,0.09), transparent 55%),
     radial-gradient(circle at 90% 90%, rgba(219,39,119,0.07), transparent 50%);
     pointer-events:none;}
  h1,h2,h3{letter-spacing:-.02em;}
  @media (max-width: 640px){ .font-ar-lg{font-size:2rem !important;} }

  /* --- Dokunma / basma animasyonu --- */
  button{ transition: transform .12s cubic-bezier(.34,1.4,.64,1), filter .12s ease, box-shadow .12s ease; }
  button:active:not(:disabled){ transform: scale(.95); }

  /* --- Menü paneli: aşağı doğru açılan animasyon --- */
  .menu-dropdown{
    position: fixed;
    top: 70px;
    right: 16px;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform-origin: top right;
    transform: translateY(-10px) scale(.94);
    opacity: 0;
    pointer-events: none;
    transition: transform .22s cubic-bezier(.2,.9,.32,1.25), opacity .16s ease;
  }
  .menu-dropdown.open{ transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
  .menu-item{ transition: background .12s ease, color .12s ease, transform .1s ease; }

  /* --- Sınav geri bildirim animasyonları --- */
  @keyframes popCheck{0%{transform:scale(.5) rotate(-8deg); opacity:0} 55%{transform:scale(1.12) rotate(2deg); opacity:1} 100%{transform:scale(1) rotate(0);}}
  @keyframes shakeX{0%,100%{transform:translateX(0)} 15%{transform:translateX(-10px)} 32%{transform:translateX(9px)} 50%{transform:translateX(-7px)} 68%{transform:translateX(6px)} 85%{transform:translateX(-3px)}}
  .anim-correct{animation:shakeX 0s;} /* no-op placeholder, real correct card uses popCheck on icon */
  .anim-wrong-card{animation:shakeX .45s ease;}
  .result-icon{width:56px;height:56px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto;animation:popCheck .38s cubic-bezier(.2,.9,.3,1.3) both;}
  .result-icon.ok{background:var(--green-soft); color:var(--green);}
  .result-icon.bad{background:var(--rose-soft); color:var(--rose);}

  /* --- Giriş ekranı --- */
  .welcome-orb{width:84px;height:84px;border-radius:28px; background:var(--grad-accent); box-shadow:0 18px 40px -14px rgba(124,58,237,.5);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  .fade-up{animation:fadeUp .35s ease both;}

  /* --- Kelime kartı (tek kart, kaydırmalı) --- */
  .flash-card{ border-radius:2.25rem; }
  @keyframes cardSlideInRight{from{transform:translateX(36px); opacity:0} to{transform:translateX(0); opacity:1}}
  @keyframes cardSlideInLeft{from{transform:translateX(-36px); opacity:0} to{transform:translateX(0); opacity:1}}
  .card-slide-in-right{animation:cardSlideInRight .28s cubic-bezier(.2,.8,.3,1) both;}
  .card-slide-in-left{animation:cardSlideInLeft .28s cubic-bezier(.2,.8,.3,1) both;}

  /* --- Sayfa geçiş animasyonu (her view değişiminde) --- */
  /* Not: transform KULLANILMAZ — #app'e transform uygulamak, içindeki
     position:fixed elemanların (ör. giriş ekranı) viewport yerine #app'e
     göre konumlanmasına neden olur ve tam ekran ortalamayı bozar. */
  @keyframes viewFadeIn{from{opacity:0} to{opacity:1}}
  .view-transition{animation:viewFadeIn .22s ease both;}

  /* --- Genel dokunma/tıklama geri bildirimi (tüm butonlar) --- */
  button{ transition: transform .12s ease, opacity .12s ease, box-shadow .12s ease; }
  button:not(:disabled):active{ transform: scale(.95); }

  /* --- Favori kalp animasyonu --- */
  [data-fav-card]{ display:inline-block; transition: transform .18s cubic-bezier(.3,1.6,.5,1); }

  /* --- Kelime kartı hover/aktif hafif kaldırma --- */
  .surface{ transition: transform .16s ease, box-shadow .16s ease; }

  /* --- Skeleton yükleniyor efekti (kurucu söz yayınlanırken vb.) --- */
  @keyframes skeletonShimmer{0%{background-position:-200px 0} 100%{background-position:calc(200px + 100%) 0}}
  .skeleton{ background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 50%, var(--surface-2) 100%); background-size:200px 100%; animation: skeletonShimmer 1.2s ease-in-out infinite; border-radius:12px; }

<!-- ============================= FIREBASE (ücretsiz, gerçek zamanlı veritabanı) =============================
     Kurucu sözlerinin TÜM kullanıcılara anlık gitmesi ve hesap/profil sisteminin çalışması için
     ücretsiz bir Firebase projesi kurman gerekiyor (kredi kartı istemez, dakikalar sürer):
       1) https://console.firebase.google.com adresine git, Google hesabınla gir.
       2) "Add project" ile yeni bir proje oluştur (adını istediğin gibi ver, ör. "kunuz-app").
       3) Sol menüden "Databases & Storage > Firestore" (bazı hesaplarda "Build > Firestore Database"
          olarak görünebilir) -> "Create database" -> bir konum seç -> güvenlik modu olarak
          "production mode / kilitli mod" seç.
       4) Firestore "Rules" sekmesine gidip aşağıdaki kuralları yapıştır ve "Publish" de:
            rules_version = '2';
            service cloud.firestore {
              match /databases/{database}/documents {
                match /oncuSozler/{docId} {
                  allow read: if true;
                  allow write: if request.auth != null && request.auth.token.email == 'FOUNDER_EMAIL_BURAYA';
                }
                match /users/{uid} {
                  allow read, write: if request.auth != null && request.auth.uid == uid;
                }
                match /leaderboard/{uid} {
                  allow read: if true;
                  allow write: if request.auth != null && request.auth.uid == uid;
                }
                match /community_messages/{msgId} {
                  allow read: if request.auth != null;
                  allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;
                  allow update, delete: if false;
                }
              }
            }
          ("FOUNDER_EMAIL_BURAYA" yerine aşağıdaki FOUNDER_EMAIL sabitine yazacağın kendi e-postanı yaz.)
       5) Sol menüden "Build > Authentication" (veya "Authentication") -> "Get started" ->
          "Sign-in method" sekmesinde "Email/Password" sağlayıcısını seçip etkinleştir.
       6) Sol üstte ⚙️ "Project settings" -> "Your apps" -> "</>" (Web) simgesine tıkla, bir isim ver ve
          kayıt ol; sana bir firebaseConfig nesnesi verecek. O nesnedeki değerleri, bu dosyada birazdan
          göreceğin FIREBASE_CONFIG sabitinin içine birebir yapıştır.
       7) Kendi hesabınla bu uygulamadan "Hesabım" menüsünden kaydol, sonra kodda FOUNDER_EMAIL sabitini
          kaydolduğun e-posta ile değiştir. Böylece sadece o hesapla giriş yapıldığında kurucu paneli açılır.
     Bu adımları tamamlayana kadar uygulama localStorage ile (sadece kendi cihazında) çalışmaya devam eder;
     hiçbir şey bozulmaz. -->

,"category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"الْحَدِيثُ الْمُرْسَلُ سَقَطَ مِنْهُ الصَّحَابِيّ","exampleTurkish":"Mürsel hadiste sahabi ravi düşmüştür.","id":2015},{"arabic":"حَدِيثٌ مُنْقَطِع","transliteration":"hadith munqati'","turkish":"munkatı hadis","root":"ق ط ع","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"الْحَدِيثُ الْمُنْقَطِعُ سَقَطَ رَاوٍ مِنْ إِسْنَادِه","exampleTurkish":"Munkatı hadiste isnaddan bir ravi düşmüştür.","id":2016},{"arabic":"حَدِيثٌ مُعَلَّق","transliteration":"hadith mu'allaq","turkish":"muallak hadis","root":"ع ل ق","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"الْحَدِيثُ الْمُعَلَّقُ حُذِفَ مِنْ أَوَّلِ إِسْنَادِه","exampleTurkish":"Muallak hadiste senedin başından ravi hazfedilmiştir.","id":2017},{"arabic":"حَدِيثٌ مُدَلَّس","transliteration":"hadith mudallas","turkish":"müdelles hadis","root":"د ل س","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"الرَّاوِي الْمُدَلِّسُ يُخْفِي عَيْبًا فِي السَّنَد","exampleTurkish":"Müdellis ravi senetteki bir kusuru gizler.","id":2018},{"arabic":"جَرْحٌ وَتَعْدِيل","transliteration":"jarh wa ta'dil","turkish":"cerh ve ta'dil ilmi","root":"ج ر ح","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"عِلْمُ الْجَرْحِ وَالتَّعْدِيلِ يُقَيِّمُ الرُّوَاة","exampleTurkish":"Cerh ve ta'dil ilmi ravileri değerlendirir.","id":2019},{"arabic":"عِلَّةٌ (hadis)","transliteration":"illa hadis","turkish":"hadisteki gizli kusur","root":"ع ل ل","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"اكْتَشَفَ الْمُحَدِّثُ عِلَّةً خَفِيَّةً فِي الْإِسْنَاد","exampleTurkish":"Muhaddis senedde gizli bir kusur keşfetti.","id":2020},{"arabic":"شَاذّ (hadis)","transliteration":"shadhdh hadis","turkish":"şazz hadis","root":"ش ذ ذ","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"الشَّاذُّ مَا خَالَفَ فِيهِ الثِّقَةُ مَنْ هُوَ أَوْثَقُ مِنْه","exampleTurkish":"Şazz, sikanın kendisinden daha güvenilirine muhalefetidir.","id":2021},{"arabic":"مُنْكَر (hadis)","transliteration":"munkar hadis","turkish":"münker hadis","root":"ن ك ر","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"مَعْرُوف","exampleArabic":"الْمُنْكَرُ مَا رَوَاهُ الضَّعِيفُ مُخَالِفًا لِلثِّقَة","exampleTurkish":"Münker, zayıfın sikaya muhalif rivayetidir.","id":2022},{"arabic":"ثِقَة (ravi)","transliteration":"thiqa ravi","turkish":"güvenilir ravi (sika)","root":"و ث ق","level":"B2","category":"Hadis Usulü","synonym":"عَدْل","antonym":"-","exampleArabic":"وَصَفَ الْعُلَمَاءُ هَذَا الرَّاوِيَ بِالثِّقَة","exampleTurkish":"Alimler bu raviyi güvenilir olarak nitelendirdi.","id":2023},{"arabic":"ضَابِط (ravi)","transliteration":"dabit ravi","turkish":"hafızası sağlam ravi","root":"ض ب ط","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"يُشْتَرَطُ فِي الرَّاوِي أَنْ يَكُونَ ضَابِطًا","exampleTurkish":"Ravide hafızasının sağlam olması şart koşulur.","id":2024},{"arabic":"عَدَالَةُ الرَّاوِي","transliteration":"adalat ar-rawi","turkish":"ravinin adaleti","root":"ع د ل","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"عَدَالَةُ الرَّاوِي شَرْطٌ لِقَبُولِ رِوَايَتِه","exampleTurkish":"Ravinin adaleti, rivayetinin kabulü için şarttır.","id":2025},{"arabic":"طَبَقَاتُ الرُّوَاة","transliteration":"tabaqat ar-ruwa","turkish":"ravilerin tabakaları","root":"ط ب ق","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"صَنَّفَ الْعُلَمَاءُ طَبَقَاتِ الرُّوَاةِ حَسَبَ عُصُورِهِم","exampleTurkish":"Alimler ravilerin tabakalarını dönemlerine göre sınıflandırdı.","id":2026},{"arabic":"تَخْرِيجُ الْحَدِيث","transliteration":"takhrij al-hadith","turkish":"hadis tahrici","root":"خ ر ج","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"قَامَ بِتَخْرِيجِ الْحَدِيثِ مِنْ مَصَادِرِهِ الْأَصْلِيَّة","exampleTurkish":"Hadisi asıl kaynaklarından tahriç etti.","id":2027},{"arabic":"شَرْحُ الْحَدِيث","transliteration":"sharh al-hadith","turkish":"hadis şerhi","root":"ش ر ح","level":"B2","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"قَرَأَ شَرْحَ الْحَدِيثِ لِفَهْمِ مَعْنَاهُ الدَّقِيق","exampleTurkish":"Anlamını tam kavramak için hadisin şerhini okudu.","id":2028},{"arabic":"تَابِعِيّ","transliteration":"tabi'i","turkish":"tabiî","root":"ت ب ع","level":"B1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"لَقِيَ التَّابِعِيُّ عَدَدًا مِنَ الصَّحَابَة","exampleTurkish":"Tabiî, birçok sahabiyle görüştü.","id":2029},{"arabic":"تَابِعُ التَّابِعِيّ","transliteration":"tabi' at-tabi'i","turkish":"tebe-i tabiin","root":"ت ب ع","level":"B2","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"رَوَى تَابِعُ التَّابِعِيِّ عَنِ التَّابِعِينَ الْكِبَار","exampleTurkish":"Tebe-i tabiin, büyük tabiinden rivayet etti.","id":2030},{"arabic":"الصَّحَابِيّ (usul)","transliteration":"as-sahabi usul","turkish":"sahabi (ıstılahta)","root":"ص ح ب","level":"B1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"الصَّحَابِيُّ مَنْ لَقِيَ النَّبِيَّ مُؤْمِنًا بِهِ وَمَاتَ عَلَى ذَلِك","exampleTurkish":"Sahabi, Peygamber'e iman ederek görüşen ve bu hal üzere ölen kimsedir.","id":2031},{"arabic":"مُسْنَد (كِتَاب)","transliteration":"musnad kitab","turkish":"müsned (hadis kitabı türü)","root":"س ن د","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"مُسْنَدُ الْإِمَامِ أَحْمَدَ مِنْ أَشْهَرِ الْمَسَانِيد","exampleTurkish":"İmam Ahmed'in Müsnedi en meşhur müsnedlerdendir.","id":2032},{"arabic":"مُصَنَّف (كِتَاب)","transliteration":"musannaf kitab","turkish":"musannef (konularına göre hadis kitabı)","root":"ص ن ف","level":"C1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"الْمُصَنَّفُ يُرَتِّبُ الْأَحَادِيثَ حَسَبَ الْأَبْوَاب","exampleTurkish":"Musannef, hadisleri bablarına göre düzenler.","id":2033},{"arabic":"سُنَن (كِتَاب)","transliteration":"sunan kitab","turkish":"sünen (hadis kitabı türü)","root":"س ن ن","level":"B2","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"سُنَنُ أَبِي دَاوُد مِنَ الْكُتُبِ الْمُعْتَمَدَة","exampleTurkish":"Ebu Davud'un Süneni muteber kitaplardandır.","id":2034},{"arabic":"الْكُتُبُ السِّتَّة","transliteration":"al-kutub as-sitta","turkish":"Kütüb-i Sitte","root":"ك ت ب","level":"B2","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"تُعْتَبَرُ الْكُتُبُ السِّتَّةُ أَصْلًا مُهِمًّا فِي الْحَدِيث","exampleTurkish":"Kütüb-i Sitte, hadiste önemli bir kaynak sayılır.","id":2035},{"arabic":"صَحِيحُ الْبُخَارِيّ","transliteration":"sahih al-bukhari","turkish":"Sahih-i Buhari","root":"ص ح ح","level":"B1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"صَحِيحُ الْبُخَارِيِّ أَصَحُّ كِتَابٍ بَعْدَ الْقُرْآن","exampleTurkish":"Sahih-i Buhari, Kur'an'dan sonra en sahih kitaptır.","id":2036},{"arabic":"صَحِيحُ مُسْلِم","transliteration":"sahih muslim","turkish":"Sahih-i Müslim","root":"ص ح ح","level":"B1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"صَحِيحُ مُسْلِمٍ يُضَاهِي صَحِيحَ الْبُخَارِيّ فِي الْمَنْزِلَة","exampleTurkish":"Sahih-i Müslim, mertebede Sahih-i Buhari'ye yakındır.","id":2037},{"arabic":"مُحَدِّث","transliteration":"muhaddith","turkish":"muhaddis (hadis alimi)","root":"ح د ث","level":"B1","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"كَانَ الْمُحَدِّثُ يَحْفَظُ آلَافَ الْأَحَادِيث","exampleTurkish":"Muhaddis, binlerce hadisi ezbere biliyordu.","id":2038},{"arabic":"حَافِظٌ (لَقَب)","transliteration":"hafiz laqab","turkish":"hafız (hadis ilminde derece)","root":"ح ف ظ","level":"B2","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"بَلَغَ دَرَجَةَ الْحَافِظِ بَعْدَ سَنَوَاتٍ مِنَ الطَّلَب","exampleTurkish":"Yıllarca ilim tahsili sonunda hafız derecesine ulaştı.","id":2039},{"arabic":"مُتْقِن (ravi)","transliteration":"mutqin ravi","turkish":"itkanlı, sağlam ravi","root":"ت ق ن","level":"B2","category":"Hadis Usulü","synonym":"ضَابِط","antonym":"-","exampleArabic":"وُصِفَ بِأَنَّهُ مُتْقِنٌ فِي رِوَايَتِه","exampleTurkish":"Rivayetinde sağlam biri olarak nitelendirildi.","id":2040},{"arabic":"عِلْمُ مُصْطَلَحِ الْحَدِيث","transliteration":"ilm mustalah al-hadith","turkish":"hadis usulü ilmi","root":"ص ل ح","level":"B2","category":"Hadis Usulü","synonym":"-","antonym":"-","exampleArabic":"يُدَرَّسُ عِلْمُ مُصْطَلَحِ الْحَدِيثِ فِي الْمَعَاهِد","exampleTurkish":"Hadis usulü ilmi enstitülerde okutulur.","id":2041},{"arabic":"أُصُولُ الْفِقْه","transliteration":"usul al-fiqh","turkish":"fıkıh usulü","root":"أ ص ل","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"أُصُولُ الْفِقْهِ عِلْمٌ يُبَيِّنُ طُرُقَ اسْتِنْبَاطِ الْأَحْكَام","exampleTurkish":"Fıkıh usulü, hükümleri çıkarma yollarını açıklayan ilimdir.","id":2042},{"arabic":"الْفِقْه","transliteration":"al-fiqh","turkish":"fıkıh","root":"ف ق ه","level":"A2","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"الْفِقْهُ عِلْمٌ بِالْأَحْكَامِ الشَّرْعِيَّةِ الْعَمَلِيَّة","exampleTurkish":"Fıkıh, ameli şer'i hükümlere dair bir ilimdir.","id":2043},{"arabic":"حُكْمٌ شَرْعِيّ","transliteration":"hukm shar'i","turkish":"şer'i hüküm","root":"ح ك م","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"لِكُلِّ فِعْلٍ حُكْمٌ شَرْعِيٌّ خَاصّ","exampleTurkish":"Her fiilin kendine has bir şer'i hükmü vardır.","id":2044},{"arabic":"وَاجِب (hüküm)","transliteration":"wajib hukm","turkish":"vacip","root":"و ج ب","level":"B1","category":"Fıkıh Usulü","synonym":"فَرْض","antonym":"حَرَام","exampleArabic":"الْوِتْرُ وَاجِبٌ عِنْدَ الْحَنَفِيَّة","exampleTurkish":"Vitir, Hanefilere göre vaciptir.","id":2045},{"arabic":"مَنْدُوب","transliteration":"mandub","turkish":"mendup, müstehab","root":"ن د ب","level":"B1","category":"Fıkıh Usulü","synonym":"مُسْتَحَبّ","antonym":"مَكْرُوه","exampleArabic":"صَلَاةُ الضُّحَى مَنْدُوبَة","exampleTurkish":"Duha namazı menduptur.","id":2046},{"arabic":"مَكْرُوه","transliteration":"makruh","turkish":"mekruh","root":"ك ر ه","level":"A2","category":"Fıkıh Usulü","synonym":"-","antonym":"مَنْدُوب","exampleArabic":"الْأَكْلُ وَالشُّرْبُ قَائِمًا مَكْرُوه","exampleTurkish":"Ayakta yiyip içmek mekruhtur.","id":2047},{"arabic":"مُبَاح","transliteration":"mubah","turkish":"mübah","root":"ب و ح","level":"A2","category":"Fıkıh Usulü","synonym":"حَلَال","antonym":"-","exampleArabic":"الصَّيْدُ لِلْحَاجَةِ مُبَاح","exampleTurkish":"İhtiyaç için avlanmak mübahtır.","id":2048},{"arabic":"فَرْضُ عَيْن","transliteration":"fard ayn","turkish":"farz-ı ayn","root":"ف ر ض","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"فَرْضُ كِفَايَة","exampleArabic":"الصَّلَوَاتُ الْخَمْسُ فَرْضُ عَيْنٍ عَلَى كُلِّ مُسْلِم","exampleTurkish":"Beş vakit namaz her Müslümana farz-ı ayndır.","id":2049},{"arabic":"فَرْضُ كِفَايَة","transliteration":"fard kifaya","turkish":"farz-ı kifaye","root":"ف ر ض","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"فَرْضُ عَيْن","exampleArabic":"صَلَاةُ الْجِنَازَةِ فَرْضُ كِفَايَة","exampleTurkish":"Cenaze namazı farz-ı kifayedir.","id":2050},{"arabic":"اجْتِهَاد (fıkhî)","transliteration":"ijtihad fiqhi","turkish":"içtihad","root":"ج ه د","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"تَقْلِيد","exampleArabic":"الِاجْتِهَادُ بَذْلُ الْوُسْعِ لِاسْتِنْبَاطِ الْحُكْم","exampleTurkish":"İçtihad, hükmü çıkarmak için tüm gücü sarf etmektir.","id":2051},{"arabic":"مُجْتَهِد","transliteration":"mujtahid","turkish":"müçtehid","root":"ج ه د","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"مُقَلِّد","exampleArabic":"يُشْتَرَطُ فِي الْمُجْتَهِدِ عِلْمٌ وَاسِعٌ بِالشَّرِيعَة","exampleTurkish":"Müçtehidde şeriata dair geniş bir ilim şart koşulur.","id":2052},{"arabic":"تَقْلِيد (fıkhî)","transliteration":"taqlid fiqhi","turkish":"taklid","root":"ق ل د","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"اجْتِهَاد","exampleArabic":"التَّقْلِيدُ اتِّبَاعُ قَوْلِ الْمُجْتَهِدِ بِلَا دَلِيل","exampleTurkish":"Taklid, delilsiz olarak müçtehidin sözüne uymaktır.","id":2053},{"arabic":"مُقَلِّد","transliteration":"muqallid","turkish":"mukallid","root":"ق ل د","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"مُجْتَهِد","exampleArabic":"أَكْثَرُ النَّاسِ الْيَوْمَ مُقَلِّدُونَ لِأَحَدِ الْمَذَاهِب","exampleTurkish":"Bugün insanların çoğu mezheplerden birine mukallittir.","id":2054},{"arabic":"فَتْوَى","transliteration":"fatwa","turkish":"fetva","root":"ف ت ي","level":"A2","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"أَصْدَرَ الْمُفْتِي فَتْوَى بِخُصُوصِ الْمَسْأَلَة","exampleTurkish":"Müftü, konu hakkında bir fetva verdi.","id":2055},{"arabic":"مُفْتٍ","transliteration":"muftin","turkish":"müftü","root":"ف ت ي","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"سَأَلَ الْمُفْتِيَ عَنْ حُكْمِ هَذِهِ الْمُعَامَلَة","exampleTurkish":"Müftüye bu muamelenin hükmünü sordu.","id":2056},{"arabic":"قِيَاس (usul)","transliteration":"qiyas usul","turkish":"kıyas (fıkıh usulünde)","root":"ق ي س","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"الْقِيَاسُ إِلْحَاقُ فَرْعٍ بِأَصْلٍ لِعِلَّةٍ جَامِعَة","exampleTurkish":"Kıyas, ortak illetten dolayı bir fer'i asla ilhak etmektir.","id":2057},{"arabic":"إِجْمَاع","transliteration":"ijma'","turkish":"icma","root":"ج م ع","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"الْإِجْمَاعُ اتِّفَاقُ الْمُجْتَهِدِينَ عَلَى حُكْمٍ شَرْعِيّ","exampleTurkish":"İcma, müçtehidlerin bir hüküm üzerinde ittifakıdır.","id":2058},{"arabic":"عِلَّةُ الْحُكْم","transliteration":"illat al-hukm","turkish":"hükmün illeti","root":"ع ل ل","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"إِسْكَارُ الْخَمْرِ هُوَ عِلَّةُ تَحْرِيمِهَا","exampleTurkish":"Şarabın haramlığının illeti sarhoş edicilik özelliğidir.","id":2059},{"arabic":"مَصْلَحَة (usul)","transliteration":"maslaha usul","turkish":"maslahat","root":"ص ل ح","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"مَفْسَدَة","exampleArabic":"تُرَاعَى الْمَصْلَحَةُ الْعَامَّةُ فِي التَّشْرِيع","exampleTurkish":"Genel maslahat, teşride gözetilir.","id":2060},{"arabic":"عُرْف (usul)","transliteration":"urf usul","turkish":"örf","root":"ع ر ف","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"الْعُرْفُ الصَّحِيحُ مُعْتَبَرٌ فِي بَعْضِ الْمَسَائِل","exampleTurkish":"Sahih örf, bazı meselelerde muteberdir.","id":2061},{"arabic":"اسْتِحْسَان","transliteration":"istihsan","turkish":"istihsan","root":"ح س ن","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"قِيَاس","exampleArabic":"اسْتَخْدَمَ الْإِمَامُ الِاسْتِحْسَانَ فِي هَذِهِ الْمَسْأَلَة","exampleTurkish":"İmam, bu meselede istihsanı kullandı.","id":2062},{"arabic":"سَدُّ الذَّرَائِع","transliteration":"sadd adh-dhara'i'","turkish":"sedd-i zerayi","root":"س د د","level":"C1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"سَدُّ الذَّرَائِعِ مَنْعُ الْمُبَاحِ خَشْيَةَ الْوُقُوعِ فِي الْحَرَام","exampleTurkish":"Sedd-i zerayi, harama düşme korkusuyla mübahı yasaklamaktır.","id":2063},{"arabic":"الْمَذَاهِبُ الْفِقْهِيَّة","transliteration":"al-madhahib al-fiqhiyya","turkish":"fıkıh mezhepleri","root":"ذ ه ب","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"لِلْمَذَاهِبِ الْفِقْهِيَّةِ الْأَرْبَعَةِ أُصُولٌ مُخْتَلِفَة","exampleTurkish":"Dört fıkıh mezhebinin farklı usulleri vardır.","id":2064},{"arabic":"الْمَذْهَبُ الْحَنَفِيّ","transliteration":"al-madhhab al-hanafi","turkish":"Hanefi mezhebi","root":"-","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"الْمَذْهَبُ الْحَنَفِيُّ مَنْسُوبٌ إِلَى الْإِمَامِ أَبِي حَنِيفَة","exampleTurkish":"Hanefi mezhebi İmam Ebu Hanife'ye nispet edilir.","id":2065},{"arabic":"الْمَذْهَبُ الشَّافِعِيّ","transliteration":"al-madhhab ash-shafi'i","turkish":"Şafii mezhebi","root":"-","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"الْمَذْهَبُ الشَّافِعِيُّ مَنْسُوبٌ إِلَى الْإِمَامِ الشَّافِعِيّ","exampleTurkish":"Şafii mezhebi İmam Şafii'ye nispet edilir.","id":2066},{"arabic":"الْمَذْهَبُ الْمَالِكِيّ","transliteration":"al-madhhab al-maliki","turkish":"Maliki mezhebi","root":"-","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"الْمَذْهَبُ الْمَالِكِيُّ مَنْتَشِرٌ فِي شَمَالِ أَفْرِيقِيَا","exampleTurkish":"Maliki mezhebi Kuzey Afrika'da yaygındır.","id":2067},{"arabic":"الْمَذْهَبُ الْحَنْبَلِيّ","transliteration":"al-madhhab al-hanbali","turkish":"Hanbeli mezhebi","root":"-","level":"B1","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"الْمَذْهَبُ الْحَنْبَلِيُّ مَنْسُوبٌ إِلَى الْإِمَامِ أَحْمَد","exampleTurkish":"Hanbeli mezhebi İmam Ahmed'e nispet edilir.","id":2068},{"arabic":"الْقَوَاعِدُ الْفِقْهِيَّة","transliteration":"al-qawa'id al-fiqhiyya","turkish":"fıkıh kaideleri","root":"ق ع د","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"تُلَخِّصُ الْقَوَاعِدُ الْفِقْهِيَّةُ مَسَائِلَ كَثِيرَة","exampleTurkish":"Fıkıh kaideleri birçok meseleyi özetler.","id":2069},{"arabic":"الضَّرُورَاتُ تُبِيحُ الْمَحْظُورَات","transliteration":"ad-darurat tubih al-mahzurat","turkish":"zaruretler yasakları mübah kılar","root":"ض ر ر","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"يُطَبَّقُ مَبْدَأُ الضَّرُورَاتِ تُبِيحُ الْمَحْظُورَاتِ فِي حَالَاتٍ خَاصَّة","exampleTurkish":"Bu kaide özel durumlarda uygulanır.","id":2070},{"arabic":"الْيَقِينُ لَا يَزُولُ بِالشَّكّ","transliteration":"al-yaqin la yazul bish-shakk","turkish":"yakîn şekle zail olmaz","root":"ي ق ن","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"هَذِهِ الْقَاعِدَةُ أَصْلٌ فِي مَسَائِلِ الطَّهَارَة","exampleTurkish":"Bu kaide, taharet meselelerinde bir asıldır.","id":2071},{"arabic":"الْمَشَقَّةُ تَجْلِبُ التَّيْسِير","transliteration":"al-mashaqqa tajlib at-taysir","turkish":"meşakkat teysiri celbeder","root":"ش ق ق","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"تُطَبَّقُ هَذِهِ الْقَاعِدَةُ فِي رُخَصِ السَّفَر","exampleTurkish":"Bu kaide, seyahat ruhsatlarında uygulanır.","id":2072},{"arabic":"الْعَادَةُ مُحَكَّمَة","transliteration":"al-'ada muhakkama","turkish":"adet muhakkemdir","root":"ع و د","level":"B2","category":"Fıkıh Usulü","synonym":"عُرْف","antonym":"-","exampleArabic":"تُعْتَبَرُ الْعَادَةُ مُحَكَّمَةً فِي كَثِيرٍ مِنَ الْمُعَامَلَات","exampleTurkish":"Adet, birçok muamelede muhakkem sayılır.","id":2073},{"arabic":"الضَّرَرُ يُزَال","transliteration":"ad-darar yuzal","turkish":"zarar giderilir","root":"ض ر ر","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"-","exampleArabic":"تَقُومُ الْقَاعِدَةُ عَلَى مَنْعِ الضَّرَرِ وَإِزَالَتِه","exampleTurkish":"Bu kaide zararın önlenmesi ve giderilmesi esasına dayanır.","id":2074},{"arabic":"نَاسِخ (usul)","transliteration":"nasikh usul","turkish":"nâsih","root":"ن س خ","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"مَنْسُوخ","exampleArabic":"الدَّلِيلُ النَّاسِخُ يَرْفَعُ حُكْمَ الدَّلِيلِ السَّابِق","exampleTurkish":"Nâsih delil, önceki delilin hükmünü kaldırır.","id":2075},{"arabic":"مَنْسُوخ","transliteration":"mansukh","turkish":"mensuh","root":"ن س خ","level":"B2","category":"Fıkıh Usulü","synonym":"-","antonym":"نَاسِخ","exampleArabic":"هَذَا الْحُكْمُ مَنْسُوخٌ بِآيَةٍ أُخْرَى","exampleTurkish":"Bu hüküm başka bir ayetle mensuhtur.","id":2076},{"arabic":"عَامّ (لَفْظ)","transliteration":"'amm lafz","turkish":"âmm (genel lafız)","root":"ع م م","level":"C1","category":"Fıkıh Usulü","synonym":"-","antonym":"خَاصّ","exampleArabic":"اللَّفْظُ الْعَامُّ يَشْمَلُ جَمِيعَ أَفْرَادِه","exampleTurkish":"Âmm lafız bütün fertlerini kapsar.","id":2077},{"arabic":"خَاصّ (لَفْظ)","transliteration":"khass lafz","turkish":"hâss (özel lafız)","root":"خ ص ص","level":"C1","category":"Fıkıh Usulü","synonym":"-","antonym":"عَامّ","exampleArabic":"اللَّفْظُ الْخَاصُّ يَدُلُّ عَلَى مَعْنًى مُحَدَّد","exampleTurkish":"Hâss lafız belirli bir manaya delalet eder.","id":2078},{"arabic":"مُطْلَق (لَفْظ)","transliteration":"mutlaq lafz","turkish":"mutlak lafız","root":"ط ل ق","level":"C1","category":"Fıkıh Usulü","synonym":"-","antonym":"مُقَيَّد","exampleArabic":"اللَّفْظُ الْمُطْلَقُ يَدُلُّ عَلَى الْمَاهِيَّةِ بِلَا قَيْد","exampleTurkish":"Mutlak lafız, mahiyete kayıtsız delalet eder.","id":2079},{"arabic":"مُقَيَّد (لَفْظ)","transliteration":"muqayyad lafz","turkish":"mukayyed lafız","root":"ق ي د","level":"C1","category":"Fıkıh Usulü","synonym":"-","antonym":"مُطْلَق","exampleArabic":"اللَّفْظُ الْمُقَيَّدُ مَقْرُونٌ بِصِفَةٍ أَوْ شَرْط","exampleTurkish":"Mukayyed lafız bir sıfat veya şartla kayıtlıdır.","id":2080},{"arabic":"مُجْمَل (لَفْظ)","transliteration":"mujmal lafz","turkish":"mücmel lafız","root":"ج م ل","level":"C1","category":"Fıkıh Usulü","synonym":"-","antonym":"مُبَيَّن","exampleArabic":"اللَّفْظُ الْمُجْمَلُ يَحْتَاجُ إِلَى بَيَان","exampleTurkish":"Mücmel lafız açıklamaya ihtiyaç duyar.","id":2081},{"arabic":"مُبَيَّن (لَفْظ)","transliteration":"mubayyan lafz","turkish":"mübeyyen lafız","root":"ب ي ن","level":"C1","category":"Fıkıh Usulü","synonym":"-","antonym":"مُجْمَل","exampleArabic":"صَارَ اللَّفْظُ مُبَيَّنًا بَعْدَ التَّفْسِير","exampleTurkish":"Lafız tefsirden sonra mübeyyen oldu.","id":2082},{"arabic":"طَهَارَة (فِقْه)","transliteration":"tahara fiqh","turkish":"taharet","root":"ط ه ر","level":"A2","category":"Fıkıh Furu","synonym":"نَجَاسَة","antonym":"-","exampleArabic":"الطَّهَارَةُ شَرْطٌ لِصِحَّةِ الصَّلَاة","exampleTurkish":"Taharet, namazın sıh "ز ك و","level":"A2","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"تَجِبُ زَكَاةُ الْمَالِ إِذَا بَلَغَ النِّصَاب","exampleTurkish":"Nisaba ulaşınca mal zekatı vacip olur.","id":2090},{"arabic":"نِصَابُ الزَّكَاة","transliteration":"nisab az-zakat","turkish":"zekat nisabı","root":"ن ص ب","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"نِصَابُ الزَّكَاةِ فِي الذَّهَبِ مُحَدَّدٌ شَرْعًا","exampleTurkish":"Altında zekat nisabı şer'an belirlenmiştir.","id":2091},{"arabic":"الرِّبَا","transliteration":"ar-riba","turkish":"riba, faiz","root":"ر ب و","level":"A2","category":"Fıkıh Furu","synonym":"فَائِدَة","antonym":"-","exampleArabic":"الرِّبَا مُحَرَّمٌ فِي جَمِيعِ الشَّرَائِع","exampleTurkish":"Riba bütün şeriatlerde haramdır.","id":2092},{"arabic":"الْبَيْعُ الْفَاسِد","transliteration":"al-bay' al-fasid","turkish":"fasid satış","root":"ف س د","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"الْبَيْعُ الصَّحِيح","exampleArabic":"الْبَيْعُ الْفَاسِدُ يَنْعَقِدُ وَيَجِبُ فَسْخُه","exampleTurkish":"Fasid satış inikat eder ama feshi gerekir.","id":2093},{"arabic":"الْبَيْعُ الْبَاطِل","transliteration":"al-bay' al-batil","turkish":"batıl satış","root":"ب ط ل","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"الْبَيْعُ الصَّحِيح","exampleArabic":"الْبَيْعُ الْبَاطِلُ لَا يَنْعَقِدُ أَصْلًا","exampleTurkish":"Batıl satış hiç inikat etmez.","id":2094},{"arabic":"الْخِيَارُ فِي الْبَيْع","transliteration":"al-khiyar fi al-bay'","turkish":"satışta muhayyerlik","root":"خ ي ر","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"خِيَارُ الشَّرْطِ نَوْعٌ مِنَ الْخِيَارِ فِي الْبَيْع","exampleTurkish":"Şart muhayyerliği, satış muhayyerliğinin bir türüdür.","id":2095},{"arabic":"الشُّفْعَة","transliteration":"ash-shuf'a","turkish":"şüf'a","root":"ش ف ع","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"لِلشَّرِيكِ حَقُّ الشُّفْعَةِ فِي الْعَقَار","exampleTurkish":"Ortağın gayrimenkulde şüf'a hakkı vardır.","id":2096},{"arabic":"الْوَقْف (فِقْه)","transliteration":"al-waqf fiqh","turkish":"vakıf (fıkhî)","root":"و ق ف","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"أَوْقَفَ أَرْضَهُ لِبِنَاءِ مَسْجِد","exampleTurkish":"Arazisini cami inşası için vakfetti.","id":2097},{"arabic":"الْوَصِيَّة (فِقْه)","transliteration":"al-wasiyya fiqh","turkish":"vasiyet (fıkhî)","root":"و ص ي","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"لَا تَجُوزُ الْوَصِيَّةُ بِأَكْثَرَ مِنَ الثُّلُث","exampleTurkish":"Malın üçte birinden fazlasına vasiyet caiz değildir.","id":2098},{"arabic":"الْمِيرَاث (فِقْه)","transliteration":"al-mirath fiqh","turkish":"miras (fıkhî)","root":"و ر ث","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"تُوَزَّعُ التَّرِكَةُ حَسَبَ أَحْكَامِ الْمِيرَاث","exampleTurkish":"Terike, miras hükümlerine göre dağıtılır.","id":2099},{"arabic":"عِلْمُ الْفَرَائِض","transliteration":"ilm al-fara'id","turkish":"feraiz ilmi","root":"ف ر ض","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"عِلْمُ الْفَرَائِضِ يُبَيِّنُ أَنْصِبَةَ الْوَرَثَة","exampleTurkish":"Feraiz ilmi, varislerin paylarını açıklar.","id":2100},{"arabic":"النِّكَاح (فِقْه)","transliteration":"an-nikah fiqh","turkish":"nikah (fıkhî)","root":"ن ك ح","level":"A2","category":"Fıkıh Furu","synonym":"زَوَاج","antonym":"الطَّلَاق","exampleArabic":"لِلنِّكَاحِ أَرْكَانٌ وَشُرُوطٌ فِي الشَّرِيعَة","exampleTurkish":"Şeriatte nikahın rükünleri ve şartları vardır.","id":2101},{"arabic":"الطَّلَاقُ الرَّجْعِيّ","transliteration":"at-talaq ar-raj'i","turkish":"ric'i talak","root":"ط ل ق","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"الطَّلَاقُ الْبَائِن","exampleArabic":"يُمْكِنُ لِلزَّوْجِ مُرَاجَعَةَ زَوْجَتِهِ فِي الطَّلَاقِ الرَّجْعِيّ","exampleTurkish":"Ric'i talakta koca eşine dönebilir.","id":2102},{"arabic":"الطَّلَاقُ الْبَائِن","transliteration":"at-talaq al-ba'in","turkish":"bâin talak","root":"ب ي ن","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"الطَّلَاقُ الرَّجْعِيّ","exampleArabic":"الطَّلَاقُ الْبَائِنُ يُنْهِي الزَّوَاجَ نِهَائِيًّا","exampleTurkish":"Bâin talak evliliği kesin olarak sonlandırır.","id":2103},{"arabic":"الْعِدَّة (فِقْه)","transliteration":"al-'idda fiqh","turkish":"iddet","root":"ع د د","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"تَعْتَدُّ الْمُطَلَّقَةُ ثَلَاثَةَ قُرُوء","exampleTurkish":"Boşanmış kadın üç hayız süresi iddet bekler.","id":2104},{"arabic":"الْحَدُّ (فِقْه)","transliteration":"al-hadd fiqh","turkish":"had cezası","root":"ح د د","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"التَّعْزِير","exampleArabic":"الْحُدُودُ عُقُوبَاتٌ مُقَدَّرَةٌ شَرْعًا","exampleTurkish":"Hadler, şer'an takdir edilmiş cezalardır.","id":2105},{"arabic":"التَّعْزِير","transliteration":"at-ta'zir","turkish":"ta'zir","root":"ع ز ر","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"الْحَدّ","exampleArabic":"التَّعْزِيرُ عُقُوبَةٌ يُقَدِّرُهَا الْقَاضِي","exampleTurkish":"Ta'zir, hâkimin takdir ettiği bir cezadır.","id":2106},{"arabic":"الدِّيَة (فِقْه)","transliteration":"ad-diya fiqh","turkish":"diyet","root":"د ي ي","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"الدِّيَةُ تَعْوِيضٌ مَالِيٌّ عَنِ الْقَتْلِ الْخَطَإ","exampleTurkish":"Diyet, hataen öldürmenin mali bir tazminatıdır.","id":2107},{"arabic":"الْقِصَاص (فِقْه)","transliteration":"al-qisas fiqh","turkish":"kısas","root":"ق ص ص","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"الْقِصَاصُ عُقُوبَةُ الْقَتْلِ الْعَمْد","exampleTurkish":"Kısas, kasten öldürmenin cezasıdır.","id":2108},{"arabic":"الْجِهَاد (فِقْه)","transliteration":"al-jihad fiqh","turkish":"cihad (fıkhî)","root":"ج ه د","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"لِلْجِهَادِ أَحْكَامٌ وَشُرُوطٌ فِي الْفِقْه","exampleTurkish":"Fıkıhta cihadın hükümleri ve şartları vardır.","id":2109},{"arabic":"الْأَمَانَاتُ الشَّرْعِيَّة","transliteration":"al-amanat ash-shar'iyya","turkish":"şer'i emanetler","root":"أ م ن","level":"B2","category":"Fıkıh Furu","synonym":"-","antonym":"-","exampleArabic":"الْوَدِيعَةُ مِنَ الْأَمَانَاتِ الشَّرْعِيَّة","exampleTurkish":"Vediat, şer'i emanetlerdendir.","id":2110},{"arabic":"الْعِبَادَات","transliteration":"al-ibadat","turkish":"ibadat (fıkıh bölümü)","root":"ع ب د","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"الْمُعَامَلَات","exampleArabic":"بَابُ الْعِبَادَاتِ يَشْمَلُ الصَّلَاةَ وَالصِّيَام","exampleTurkish":"İbadat bölümü namaz ve orucu kapsar.","id":2111},{"arabic":"الْمُعَامَلَات","transliteration":"al-mu'amalat","turkish":"muamelat (fıkıh bölümü)","root":"ع م ل","level":"B1","category":"Fıkıh Furu","synonym":"-","antonym":"الْعِبَادَات","exampleArabic":"بَابُ الْمُعَامَلَاتِ يَشْمَلُ الْبَيْعَ وَالْإِجَارَة","exampleTurkish":"Muamelat bölümü alışveriş ve icareyi kapsar.","id":2112},{"arabic":"عِلْمُ الْكَلَام","transliteration":"ilm al-kalam","turkish":"kelam ilmi","root":"ك ل م","level":"B2","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"عِلْمُ الْكَلَامِ يُثْبِتُ الْعَقَائِدَ بِالْأَدِلَّةِ الْعَقْلِيَّة","exampleTurkish":"Kelam ilmi, akaidi akli delillerle ispat eder.","id":2113},{"arabic":"الْأَسْمَاءُ وَالصِّفَات","transliteration":"al-asma' wa as-sifat","turkish":"esma ve sıfat","root":"س م و","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"بَابُ الْأَسْمَاءِ وَالصِّفَاتِ مِنْ أَهَمِّ أَبْوَابِ الْعَقِيدَة","exampleTurkish":"Esma ve sıfat bahsi, akaidin en önemli bahislerindendir.","id":2114},{"arabic":"الصِّفَاتُ السَّلْبِيَّة","transliteration":"as-sifat as-salbiyya","turkish":"selbî sıfatlar","root":"س ل ب","level":"C1","category":"Akaid","synonym":"-","antonym":"الصِّفَاتُ الثُّبُوتِيَّة","exampleArabic":"الصِّفَاتُ السَّلْبِيَّةُ تَنْفِي النَّقْصَ عَنِ اللَّه","exampleTurkish":"Selbî sıfatlar, eksikliği Allah'tan nefyeder.","id":2115},{"arabic":"الصِّفَاتُ الثُّبُوتِيَّة","transliteration":"as-sifat ath-thubutiyya","turkish":"sübutî sıfatlar","root":"ث ب ت","level":"C1","category":"Akaid","synonym":"-","antonym":"الصِّفَاتُ السَّلْبِيَّة","exampleArabic":"الصِّفَاتُ الثُّبُوتِيَّةُ كَالْعِلْمِ وَالْقُدْرَة","exampleTurkish":"Sübutî sıfatlar; ilim ve kudret gibi sıfatlardır.","id":2116},{"arabic":"الْقَضَاءُ وَالْقَدَر","transliteration":"al-qada' wa al-qadar","turkish":"kaza ve kader","root":"ق د ر","level":"A2","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"الْإِيمَانُ بِالْقَضَاءِ وَالْقَدَرِ رُكْنٌ مِنْ أَرْكَانِ الْإِيمَان","exampleTurkish":"Kaza ve kadere iman, imanın rükünlerindendir.","id":2117},{"arabic":"الْجَبْر (كَلَام)","transliteration":"al-jabr kalam","turkish":"cebir (kelam terimi)","root":"ج ب ر","level":"C1","category":"Akaid","synonym":"-","antonym":"الِاخْتِيَار","exampleArabic":"أَنْكَرَتِ الْجَبْرِيَّةُ إِرَادَةَ الْإِنْسَانِ الْحُرَّة","exampleTurkish":"Cebriyye, insanın hür iradesini inkar etti.","id":2118},{"arabic":"الِاخْتِيَار (كَلَام)","transliteration":"al-ikhtiyar kalam","turkish":"ihtiyar (irade hürriyeti)","root":"خ ي ر","level":"C1","category":"Akaid","synonym":"-","antonym":"الْجَبْر","exampleArabic":"الِاخْتِيَارُ قُدْرَةُ الْإِنْسَانِ عَلَى فِعْلِهِ وَتَرْكِه","exampleTurkish":"İhtiyar, insanın fiilini yapma veya terk etme gücüdür.","id":2119},{"arabic":"أَهْلُ السُّنَّةِ وَالْجَمَاعَة","transliteration":"ahl as-sunna wa al-jama'a","turkish":"Ehl-i Sünnet ve'l-Cemaat","root":"س ن ن","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"أَهْلُ السُّنَّةِ وَالْجَمَاعَةِ هُمُ الْأَغْلَبِيَّةُ فِي الْأُمَّة","exampleTurkish":"Ehl-i Sünnet ve'l-Cemaat, ümmetin çoğunluğudur.","id":2120},{"arabic":"الْفِرَقُ الْإِسْلَامِيَّة","transliteration":"al-firaq al-islamiyya","turkish":"İslami fırkalar","root":"ف ر ق","level":"B2","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"دَرَسَ الطَّالِبُ تَارِيخَ الْفِرَقِ الْإِسْلَامِيَّة","exampleTurkish":"Öğrenci İslami fırkaların tarihini okudu.","id":2121},{"arabic":"حُدُوثُ الْعَالَم","transliteration":"huduth al-'alam","turkish":"alemin hâdis oluşu","root":"ح د ث","level":"C1","category":"Akaid","synonym":"-","antonym":"قِدَمُ الْعَالَم","exampleArabic":"يَسْتَدِلُّ الْمُتَكَلِّمُونَ بِحُدُوثِ الْعَالَمِ عَلَى وُجُودِ الْخَالِق","exampleTurkish":"Kelamcılar, alemin hâdis oluşuyla Yaratıcı'nın varlığına istidlal eder.","id":2122},{"arabic":"إِثْبَاتُ وُجُودِ اللَّه","transliteration":"ithbat wujud Allah","turkish":"Allah'ın varlığının ispatı","root":"ث ب ت","level":"B2","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"تَتَنَاوَلُ كُتُبُ الْكَلَامِ إِثْبَاتَ وُجُودِ اللَّهِ بِالْأَدِلَّة","exampleTurkish":"Kelam kitapları, Allah'ın varlığını delillerle ispatı ele alır.","id":2123},{"arabic":"الْمُعْجِزَة (كَلَام)","transliteration":"al-mu'jiza kalam","turkish":"mucize (kelam terimi)","root":"ع ج ز","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"الْمُعْجِزَةُ دَلِيلٌ عَلَى صِدْقِ النَّبِيّ","exampleTurkish":"Mucize, peygamberin doğruluğuna delildir.","id":2124},{"arabic":"الْكَرَامَة (كَلَام)","transliteration":"al-karama kalam","turkish":"keramet","root":"ك ر م","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"الْكَرَامَةُ أَمْرٌ خَارِقٌ يُجْرِيهِ اللَّهُ عَلَى يَدِ وَلِيّ","exampleTurkish":"Keramet, Allah'ın bir veli eliyle gösterdiği harikulade bir haldir.","id":2125},{"arabic":"عِصْمَةُ الْأَنْبِيَاء","transliteration":"ismat al-anbiya'","turkish":"peygamberlerin ismeti","root":"ع ص م","level":"B2","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"عِصْمَةُ الْأَنْبِيَاءِ مِنَ الْكَبَائِرِ مُتَّفَقٌ عَلَيْهَا","exampleTurkish":"Peygamberlerin büyük günahlardan ismeti üzerinde ittifak edilmiştir.","id":2126},{"arabic":"عَذَابُ الْقَبْر","transliteration":"adhab al-qabr","turkish":"kabir azabı","root":"ع ذ ب","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"نُؤْمِنُ بِعَذَابِ الْقَبْرِ وَنَعِيمِه","exampleTurkish":"Kabir azabına ve nimetine iman ederiz.","id":2127},{"arabic":"الْمِيزَان (عَقِيدَة)","transliteration":"al-mizan aqida","turkish":"mizan (akaid)","root":"و ز ن","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"تُوزَنُ أَعْمَالُ الْعِبَادِ فِي الْمِيزَانِ يَوْمَ الْقِيَامَة","exampleTurkish":"Kulların amelleri kıyamet günü mizanda tartılır.","id":2128},{"arabic":"الصِّرَاط (عَقِيدَة)","transliteration":"as-sirat aqida","turkish":"sırat (akaid)","root":"ص ر ط","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"يَمُرُّ النَّاسُ عَلَى الصِّرَاطِ يَوْمَ الْقِيَامَة","exampleTurkish":"İnsanlar kıyamet günü sırattan geçer.","id":2129},{"arabic":"الشَّفَاعَة (عَقِيدَة)","transliteration":"ash-shafa'a aqida","turkish":"şefaat (akaid)","root":"ش ف ع","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"شَفَاعَةُ النَّبِيِّ ثَابِتَةٌ بِالْأَحَادِيثِ الصَّحِيحَة","exampleTurkish":"Peygamberin şefaati sahih hadislerle sabittir.","id":2130},{"arabic":"خَلْقُ الْأَفْعَال","transliteration":"khalq al-af'al","turkish":"fiillerin yaratılması","root":"خ ل ق","level":"C1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"اخْتَلَفَ الْمُتَكَلِّمُونَ فِي خَلْقِ أَفْعَالِ الْعِبَاد","exampleTurkish":"Kelamcılar kulların fiillerinin yaratılması konusunda ihtilaf etti.","id":2131},{"arabic":"الْكَسْب (عَقِيدَة)","transliteration":"al-kasb aqida","turkish":"kesb","root":"ك س ب","level":"C1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"نَظَرِيَّةُ الْكَسْبِ لِلْأَشْعَرِيِّ فِي أَفْعَالِ الْعِبَاد","exampleTurkish":"Kesb nazariyesi, Eş'arî'nin kulların fiilleri hakkındaki görüşüdür.","id":2132},{"arabic":"التَّكْلِيف (عَقِيدَة)","transliteration":"at-taklif aqida","turkish":"teklif (mükellefiyet)","root":"ك ل ف","level":"B2","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"يَبْدَأُ التَّكْلِيفُ بِالْبُلُوغِ وَالْعَقْل","exampleTurkish":"Teklif, buluğ ve akılla başlar.","id":2133},{"arabic":"الْمُكَلَّف","transliteration":"al-mukallaf","turkish":"mükellef","root":"ك ل ف","level":"B1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"الْمُكَلَّفُ هُوَ الْبَالِغُ الْعَاقِل","exampleTurkish":"Mükellef, buluğa ermiş akıllı kişidir.","id":2134},{"arabic":"عِلْمُ التَّوْحِيد","transliteration":"ilm at-tawhid","turkish":"tevhid ilmi","root":"و ح د","level":"B1","category":"Akaid","synonym":"عِلْمُ الْكَلَام","antonym":"-","exampleArabic":"يُبَيِّنُ عِلْمُ التَّوْحِيدِ وُجُوبَ وَحْدَانِيَّةِ اللَّه","exampleTurkish":"Tevhid ilmi Allah'ın vahdaniyetinin vücubunu açıklar.","id":2135},{"arabic":"الذَّاتُ الْإِلَهِيَّة","transliteration":"adh-dhat al-ilahiyya","turkish":"zât-ı ilahiyye","root":"ذ و ت","level":"C1","category":"Akaid","synonym":"-","antonym":"-","exampleArabic":"لَا يُمْكِنُ إِدْرَاكُ الذَّاتِ الْإِلَهِيَّةِ بِالْعَقْلِ الْمُجَرَّد","exampleTurkish":"İlahi zât salt akılla idrak edilemez.","id":2136},{"arabic":"السِّيرَةُ النَّبَوِيَّة","transliteration":"as-sira an-nabawiyya","turkish":"siyer-i nebeviyye","root":"س ي ر","level":"A2","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"تَتَنَاوَلُ السِّيرَةُ النَّبَوِيَّةُ حَيَاةَ النَّبِيِّ كَامِلَة","exampleTurkish":"Siyer-i nebeviyye, Peygamber'in hayatını bütünüyle ele alır.","id":2137},{"arabic":"الْمَغَازِي","transliteration":"al-maghazi","turkish":"megazi (gazveler ilmi)","root":"غ ز و","level":"B1","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"كَتَبَ الْعُلَمَاءُ كُتُبًا فِي الْمَغَازِي","exampleTurkish":"Alimler megazi hakkında kitaplar yazdı.","id":2138},{"arabic":"بَدْر (غَزْوَة)","transliteration":"badr ghazwa","turkish":"Bedir (gazve)","root":"-","level":"A2","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"غَزْوَةُ بَدْرٍ أَوَّلُ مَعْرَكَةٍ كُبْرَى فِي الْإِسْلَام","exampleTurkish":"Bedir Gazvesi İslam'daki ilk büyük savaştır.","id":2139},{"arabic":"خَيْبَر","transliteration":"khaybar","turkish":"Hayber","root":"-","level":"B1","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"فُتِحَتْ خَيْبَرُ فِي السَّنَةِ السَّابِعَةِ لِلْهِجْرَة","exampleTurkish":"Hayber, hicretin yedinci yılında fethedildi.","id":2140},{"arabic":"حُنَيْن","transliteration":"hunayn","turkish":"Huneyn","root":"-","level":"B1","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"وَقَعَتْ غَزْوَةُ حُنَيْنٍ بَعْدَ فَتْحِ مَكَّة","exampleTurkish":"Huneyn Gazvesi, Mekke fethinden sonra oldu.","id":2141},{"arabic":"فَتْحُ مَكَّة","transliteration":"fath makka","turkish":"Mekke'nin fethi","root":"ف ت ح","level":"A2","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"دَخَلَ النَّبِيُّ مَكَّةَ فَاتِحًا دُونَ قِتَال","exampleTurkish":"Peygamber, Mekke'ye savaşmaksızın fatih olarak girdi.","id":2142},{"arabic":"صُلْحُ الْحُدَيْبِيَة","transliteration":"sulh al-hudaybiya","turkish":"Hudeybiye Antlaşması","root":"ص ل ح","level":"B1","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"كَانَ صُلْحُ الْحُدَيْبِيَةِ فَتْحًا مُبِينًا لِلْمُسْلِمِين","exampleTurkish":"Hudeybiye Antlaşması Müslümanlar için apaçık bir fetihti.","id":2143},{"arabic":"الْمُهَاجِرُون","transliteration":"al-muhajirun","turkish":"Muhacirler","root":"ه ج ر","level":"A2","category":"Siyer","synonym":"-","antonym":"الْأَنْصَار","exampleArabic":"تَرَكَ الْمُهَاجِرُونَ دِيَارَهُمْ فِي سَبِيلِ اللَّه","exampleTurkish":"Muhacirler, Allah yolunda yurtlarını terk ettiler.","id":2144},{"arabic":"الْأَنْصَار","transliteration":"al-ansar","turkish":"Ensar","root":"ن ص ر","level":"A2","category":"Siyer","synonym":"-","antonym":"الْمُهَاجِرُون","exampleArabic":"آوَى الْأَنْصَارُ إِخْوَانَهُمُ الْمُهَاجِرِين","exampleTurkish":"Ensar, muhacir kardeşlerini barındırdı.","id":2145},{"arabic":"بَيْعَةُ الرِّضْوَان","transliteration":"bay'at ar-ridwan","turkish":"Rıdvan Biatı","root":"ب ي ع","level":"B1","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"بَايَعَ الصَّحَابَةُ النَّبِيَّ تَحْتَ الشَّجَرَةِ فِي بَيْعَةِ الرِّضْوَان","exampleTurkish":"Sahabe, Rıdvan Biatı'nda ağacın altında peygambere biat etti.","id":2146},{"arabic":"بَيْعَةُ الْعَقَبَة","transliteration":"bay'at al-'aqaba","turkish":"Akabe Biatı","root":"ب ي ع","level":"B1","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"كَانَتْ بَيْعَةُ الْعَقَبَةِ بِدَايَةَ انْتِشَارِ الْإِسْلَامِ فِي الْمَدِينَة","exampleTurkish":"Akabe Biatı, İslam'ın Medine'de yayılmasının başlangıcıydı.","id":2147},{"arabic":"حَجَّةُ الْوَدَاع","transliteration":"hajjat al-wada'","turkish":"Veda Haccı","root":"و د ع","level":"A2","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"أَدَّى النَّبِيُّ حَجَّةَ الْوَدَاعِ فِي السَّنَةِ الْعَاشِرَة","exampleTurkish":"Peygamber, Veda Haccı'nı hicretin onuncu yılında yaptı.","id":2148},{"arabic":"خُطْبَةُ الْوَدَاع","transliteration":"khutbat al-wada'","turkish":"Veda Hutbesi","root":"خ ط ب","level":"A2","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"تَضَمَّنَتْ خُطْبَةُ الْوَدَاعِ وَصَايَا عَظِيمَة","exampleTurkish":"Veda Hutbesi büyük tavsiyeler içeriyordu.","id":2149},{"arabic":"الْخُلَفَاءُ الرَّاشِدُون","transliteration":"al-khulafa' ar-rashidun","turkish":"Hulefa-i Raşidin","root":"خ ل ف","level":"A2","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"حَكَمَ الْخُلَفَاءُ الرَّاشِدُونَ بَعْدَ وَفَاةِ النَّبِيّ","exampleTurkish":"Hulefa-i Raşidin, Peygamber'in vefatından sonra hükmetti.","id":2150},{"arabic":"دَارُ الْأَرْقَم","transliteration":"dar al-arqam","turkish":"Erkam'ın evi","root":"-","level":"B1","category":"Siyer","synonym":"-","antonym":"-","exampleArabic":"اجْتَمَعَ الْمُسْلِمُونَ الْأَوَائِلُ فِي دَارِ الْأَرْقَم","exampleTurkish":"İlk Müslümanlar Erkam'ın evinde toplandı.","id":2151},{"arabic":"عِلْمُ النَّحْو","transliteration":"ilm an-nahw","turkish":"nahiv ilmi","root":"ن ح و","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"عِلْمُ النَّحْوِ يَضْبِطُ أَوَاخِرَ الْكَلِمَاتِ فِي الْجُمْلَة","exampleTurkish":"Nahiv ilmi, cümledeki kelimelerin sonlarını düzenler.","id":2152},{"arabic":"عِلْمُ الصَّرْف","transliteration":"ilm as-sarf","turkish":"sarf ilmi","root":"ص ر ف","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"عِلْمُ الصَّرْفِ يَدْرُسُ بِنْيَةَ الْكَلِمَة","exampleTurkish":"Sarf ilmi, kelimenin yapısını inceler.","id":2153},{"arabic":"الْإِعْرَاب","transliteration":"al-i'rab","turkish":"i'rab","root":"ع ر ب","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"الْإِعْرَابُ تَغْيِيرُ أَوَاخِرِ الْكَلِمِ حَسَبَ الْعَوَامِل","exampleTurkish":"İ'rab, amillere göre kelime sonlarının değişmesidir.","id":2154},{"arabic":"الْبِنَاء (صَرْف)","transliteration":"al-bina' sarf","turkish":"bina (sarf terimi)","root":"ب ن ي","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"الْإِعْرَاب","exampleArabic":"الْحَرْفُ مَبْنِيٌّ دَائِمًا وَلَا يَتَغَيَّرُ آخِرُهُ","exampleTurkish":"Harf her zaman mebnidir, sonu değişmez.","id":2155},{"arabic":"الْمُعْرَب","transliteration":"al-mu'rab","turkish":"mu'reb kelime","root":"ع ر ب","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"الْمَبْنِيّ","exampleArabic":"الِاسْمُ وَالْفِعْلُ الْمُضَارِعُ مُعْرَبَان","exampleTurkish":"İsim ve muzari fiil mu'rebdir.","id":2156},{"arabic":"الْمَبْنِيّ","transliteration":"al-mabniyy","turkish":"mebni kelime","root":"ب ن ي","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"الْمُعْرَب","exampleArabic":"الْفِعْلُ الْمَاضِي وَالْأَمْرُ مَبْنِيَّان","exampleTurkish":"Mazi ve emir fiilleri mebnidir.","id":2157},{"arabic":"الْمُبْتَدَأُ وَالْخَبَر","transliteration":"al-mubtada' wa al-khabar","turkish":"mübteda ve haber","root":"ب د أ","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"تَتَكَوَّنُ الْجُمْلَةُ الِاسْمِيَّةُ مِنْ مُبْتَدَأٍ وَخَبَر","exampleTurkish":"İsim cümlesi mübteda ve haberden oluşur.","id":2158},{"arabic":"الْجَرُّ وَالْمَجْرُور","transliteration":"al-jarr wa al-majrur","turkish":"cer ve mecrur","root":"ج ر ر","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"حَرْفُ الْجَرِّ يَجُرُّ الِاسْمَ بَعْدَه","exampleTurkish":"Cer harfi, kendinden sonraki ismi cer eder.","id":2159},{"arabic":"حُرُوفُ الْجَرّ","transliteration":"huruf al-jarr","turkish":"cer harfleri","root":"ج ر ر","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"مِنْ وَإِلَى وَعَلَى مِنْ حُرُوفِ الْجَرّ","exampleTurkish":"Min, ilâ ve alâ cer harflerindendir.","id":2160},{"arabic":"الْمُضَافُ وَالْمُضَافُ إِلَيْه","transliteration":"al-mudaf wa al-mudaf ilayh","turkish":"muzaf ve muzafun ileyh","root":"ض ي ف","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"كِتَابُ الطَّالِبِ مُضَافٌ وَمُضَافٌ إِلَيْه","exampleTurkish":"'Öğrencinin kitabı' bir izafet terkibidir.","id":2161},{"arabic":"الْجُمْلَةُ الِاسْمِيَّة","transliteration":"al-jumla al-ismiyya","turkish":"isim cümlesi","root":"س م و","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"الْجُمْلَةُ الْفِعْلِيَّة","exampleArabic":"الْجُمْلَةُ الِاسْمِيَّةُ تَبْدَأُ بِاسْم","exampleTurkish":"İsim cümlesi bir isimle başlar.","id":2162},{"arabic":"الْجُمْلَةُ الْفِعْلِيَّة","transliteration":"al-jumla al-fi'liyya","turkish":"fiil cümlesi","root":"ف ع ل","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"الْجُمْلَةُ الِاسْمِيَّة","exampleArabic":"الْجُمْلَةُ الْفِعْلِيَّةُ تَبْدَأُ بِفِعْل","exampleTurkish":"Fiil cümlesi bir fiille başlar.","id":2163},{"arabic":"الْمَصْدَر (نَحْو)","transliteration":"al-masdar nahw","turkish":"mastar","root":"ص د ر","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"الْمَصْدَرُ اسْمٌ يَدُلُّ عَلَى الْحَدَثِ مُجَرَّدًا مِنَ الزَّمَن","exampleTurkish":"Mastar, zamandan soyutlanmış olayı gösteren isimdir.","id":2164},{"arabic":"اسْمُ الْفَاعِل","transliteration":"ism al-fa'il","turkish":"ism-i fail","root":"ف ع ل","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"اسْمُ الْمَفْعُول","exampleArabic":"اسْمُ الْفَاعِلِ يَدُلُّ عَلَى مَنْ قَامَ بِالْفِعْل","exampleTurkish":"İsm-i fail, fiili yapanı gösterir.","id":2165},{"arabic":"اسْمُ الْمَفْعُول","transliteration":"ism al-maf'ul","turkish":"ism-i meful","root":"ف ع ل","level":"B1","category":"Nahiv-Sarf","synonym":"-","antonym":"اسْمُ الْفَاعِل","exampleArabic":"اسْمُ الْمَفْعُولِ يَدُلُّ عَلَى مَنْ وَقَعَ عَلَيْهِ الْفِعْل","exampleTurkish":"İsm-i meful, kendisine fiil yapılanı gösterir.","id":2166},{"arabic":"صِيغَةُ الْمُبَالَغَة","transliteration":"sighat al-mubalagha","turkish":"mübalağa sigası","root":"ب ل غ","level":"B2","category":"Nahiv-Sarf","synonym":"-","antonym":"-","exampleArabic":"فَعَّالٌ صِيغَةُ مُبَالَغَةٍ مِثْلُ غَفَّار","exampleTurkish":"'Fa''al' vezni, 'Gaffâr' gibi mübalağa sigasıdır.","id":2167},{"arabic":"الْفِعْلُ الْمَاضِي","transliteration":"al-fi'l al-madi","turkish":"mazi fiil","root":"م ض ي","level":"A2","category":"Nahiv-Sarf","synonym":"-","antonym":"الْفِعْلُ الْمُضَارِع","exampleArabic":"الْفِعْلُ الْمَاضِي يَدُلُّ عَلَى حَدَثٍ وَقَعَ فِي الزَّمَنِ الْمَاضِي","exampleTurkish":"Mazi fiil, geçmiş zamanda vukû bulan olayı gösterir.","id":2168},{"arabic":"الْفِعْلُ الْمُضَارِع","transliteration":"al-fi'l al-mudari'","turkish":"muzari fiil","root":"ض ر ع","level":"A2","category":"Nahiv-Sarf","synonym":"-","antonym":"الْفِعْلُ الْمَاضِي","exampleArabic":"الْفِعْلُ الْمُضَارِعُ يَدُلُّ عَلَى الْحَاضِرِ أَوِ الْمُسْتَقْبَل","exampleTurkish":"Muzari fiil, şimdiki veya gelecek zamanı gösterir.","id":2169},{"arabic":"فِعْلُ الْأَمْر","transliteration":"fi'l al-amr","turkish":"emir fiili","root":"أ م ر","level":"A2","category":"Nahiv-Sarf","synonym":"-", ü","synonym":"-","antonym":"-","exampleArabic":"الْمُحْكَمُ وَاضِحُ الدَّلَالَةِ وَالْمُتَشَابِهُ يَحْتَمِلُ مَعَانِيَ عِدَّة","exampleTurkish":"Muhkem manası açıktır, müteşabih birden çok manaya muhtemeldir.","id":2176},{"arabic":"التَّفْسِيرُ بِالْمَأْثُور","transliteration":"at-tafsir bil-ma'thur","turkish":"rivayet tefsiri","root":"أ ث ر","level":"B2","category":"Tefsir Usulü","synonym":"-","antonym":"التَّفْسِيرُ بِالرَّأْي","exampleArabic":"التَّفْسِيرُ بِالْمَأْثُورِ يَعْتَمِدُ عَلَى الْقُرْآنِ وَالسُّنَّة","exampleTurkish":"Rivayet tefsiri, Kur'an ve Sünnete dayanır.","id":2177},{"arabic":"التَّفْسِيرُ بِالرَّأْي","transliteration":"at-tafsir bir-ra'y","turkish":"dirayet tefsiri","root":"ر أ ي","level":"B2","category":"Tefsir Usulü","synonym":"-","antonym":"التَّفْسِيرُ بِالْمَأْثُور","exampleArabic":"التَّفْسِيرُ بِالرَّأْيِ يَعْتَمِدُ عَلَى الِاجْتِهَادِ الْعِلْمِيّ","exampleTurkish":"Dirayet tefsiri, ilmi ictihada dayanır.","id":2178},{"arabic":"الْمَكِّيُّ وَالْمَدَنِيّ","transliteration":"al-makki wa al-madani","turkish":"Mekki ve Medeni ayetler","root":"-","level":"B1","category":"Tefsir Usulü","synonym":"-","antonym":"-","exampleArabic":"الْآيَاتُ الْمَكِّيَّةُ نَزَلَتْ قَبْلَ الْهِجْرَة","exampleTurkish":"Mekki ayetler hicretten önce indi.","id":2179},{"arabic":"عِلْمُ الْقِرَاءَات","transliteration":"ilm al-qira'at","turkish":"kıraat ilmi","root":"ق ر أ","level":"B1","category":"Tefsir Usulü","synonym":"-","antonym":"-","exampleArabic":"عِلْمُ الْقِرَاءَاتِ يَدْرُسُ أَوْجُهَ قِرَاءَةِ الْقُرْآن","exampleTurkish":"Kıraat ilmi, Kur'an'ın okunuş şekillerini inceler.","id":2180},{"arabic":"التَّجْوِيد","transliteration":"at-tajwid","turkish":"tecvid","root":"ج و د","level":"A2","category":"Tefsir Usulü","synonym":"-","antonym":"-","exampleArabic":"التَّجْوِيدُ يُعَلِّمُ صَحِيحَ نُطْقِ الْحُرُوف","exampleTurkish":"Tecvid, harflerin doğru telaffuzunu öğretir.","id":2181},{"arabic":"الْوَقْفُ وَالِابْتِدَاء","transliteration":"al-waqf wa al-ibtida'","turki /* Yeni kelime için tahmini seviye: aynı türdeki mevcut kelimelerin ortalama
   seviyesi + kelime uzunluğuna göre hafif ayar. Kesin bir yapay zekâ analizi
   değil, veri setindeki örüntüye dayanan şeffaf bir tahmindir. */
const LEVEL_RANK = {A1:1, A2:2, B1:3, B2:4, C1:5};
const RANK_TO_LEVEL = ['A1','A2','B1','B2','C1'];
function estimateWordLevel(arabicWord, category){
  const letterCount = (arabicWord||'').replace(/[\u064B-\u0652\u0670\u0640\s]/g,'').length;
  const sameCategory = ARABIC_WORDS.filter(w=>w.category===category);
  let base;
  if(sameCategory.length>0){
    base = sameCategory.reduce((sum,w)=>sum+LEVEL_RANK[w.level],0)/sameCategory.length;
  } else {
    base = 3;
  }
  let lenAdj = 0;
  if(letterCount<=3) lenAdj=-0.6;
  else if(letterCount<=5) lenAdj=0;
  else if(letterCount<=7) lenAdj=0.5;
  else lenAdj=1.1;
  let rank = Math.round(base + lenAdj*0.5);
  rank = Math.max(1, Math.min(5, rank));
  return RANK_TO_LEVEL[rank-1];
}
